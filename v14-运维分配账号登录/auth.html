<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1013"><title>登录 · 镋钯机器人</title><link rel="stylesheet" href="assets/auth-v14.css"></head><body><main class="login-shell"><header class="brand"><div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="4"/><path d="M12 3v4M8 13v2M16 13v2"/></svg></div><div class="brand-name"><strong>镋钯机器人</strong><small>机器人运营平台</small></div></header><section class="visual" aria-label="镋钯机器人形象"><div class="visual-horizon"></div><div class="visual-copy"><span>机器人工作台</span><h1>连接设备<br>开始工作</h1><p>统一查看机器人、任务与运行状态</p></div><img class="robot" src="assets/robot-golden-yellow.webp" alt="镋钯机器人"><div class="scan" aria-hidden="true"></div></section><section class="form-panel" aria-labelledby="loginTitle"><div class="form-head"><h2 id="loginTitle">账号登录</h2><span>客户工作台</span></div><form id="loginForm"><label class="field" for="account"><span>账号</span><span class="field-control"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg><input id="account" name="account" autocomplete="username" placeholder="请输入分配的账号" required></span></label><label class="field" for="password"><span>密码</span><span class="field-control"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required><button class="eye" type="button" id="togglePassword" aria-label="显示密码" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="2.5"/></svg></button></span></label><button class="submit" id="submit" type="submit">登录<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></button></form><div class="form-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3 9 8 11 5-2 8-6 8-11V5Z"/><path d="m9 12 2 2 4-4"/></svg><span>账号由运维平台统一开通</span></div></section><div class="footer">账号或密码问题，请联系运维管理员</div><div class="toast" id="toast" role="status" hidden></div></main><script>
const $=id=>document.getElementById(id);let toastTimer;
function message(copy){$('toast').textContent=copy;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,2500)}
$('togglePassword').onclick=()=>{const shown=$('password').type==='text';$('password').type=shown?'password':'text';$('togglePassword').setAttribute('aria-label',shown?'显示密码':'隐藏密码');$('togglePassword').setAttribute('aria-pressed',String(!shown))};
$('loginForm').onsubmit=e=>{e.preventDefault();const account=$('account').value.trim(),password=$('password').value;if(!account||!password)return message('请输入账号和密码');$('submit').disabled=true;$('submit').firstChild.textContent='正在进入';try{sessionStorage.setItem('tangpa.prototype.session',JSON.stringify({account,time:Date.now()}))}catch(e){}setTimeout(()=>{const mode=new URLSearchParams(location.search).get('m');location.href='home.html'+(mode==='local'?'?m=local':'')},420)};
</script></body></html>
