<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>智能体详情 · 镋钯机器人</title><link rel="stylesheet" href="assets/device-flow.css"><link rel="stylesheet" href="assets/full-app.css"><link rel="stylesheet" href="assets/agent-v10.css"></head><body><script src="assets/device-flow.js"></script><script src="assets/full-app.js"></script><script src="assets/agent-store.js"></script><script>
const {icon,esc}=Fleet;const id=new URLSearchParams(location.search).get('id');const a=AgentStore.get(id);
if(!a){AppUI.page('智能体详情',`<div class="page-intro"><h1>未找到智能体</h1></div><a class="button secondary" href="agents.html">返回智能体</a>`,{back:'agents.html'})}
else{const docs=Array.isArray(a.docs)?a.docs:[];const content=`<section class="agent-detail-hero"><span class="agent-status ${a.ready?'':'pending'}">${a.ready?'配置完整':'待配置'}</span><div class="agent-detail-glyph">${esc(a.glyph||a.name?.charAt(0)||'智')}</div><h1>${esc(a.name)}</h1><p>${esc(a.role||'未命名场景')}</p></section><p class="agent-detail-desc">${esc(a.desc||'尚未添加人设')}</p><section class="agent-detail-block"><h2>能力配置</h2><div class="agent-detail-panel"><div class="agent-detail-row"><span>对话模型</span><strong>${esc(a.model||'未设置')}</strong></div><div class="agent-detail-row"><span>声音</span><strong>${esc(a.voice||'未设置')}</strong></div><div class="agent-detail-row"><span>绑定机器人</span><strong>${Number(a.bound)||0} 台</strong></div><div class="agent-detail-row"><span>开场白</span><strong>${esc(a.opening||'未设置')}</strong></div></div></section><section class="agent-detail-block"><h2>知识库 · ${docs.length}</h2><div class="agent-detail-panel">${docs.length?docs.map(d=>`<div class="agent-document">${esc(d)}</div>`).join(''):'<div class="agent-document">暂无文档</div>'}</div></section><a class="agent-edit-button" href="agent-builder.html?agent=${encodeURIComponent(a.id)}">编辑智能体 ${icon('arrow',17)}</a><a class="agent-robot-link" href="home.html">查看机器人 ›</a>`;AppUI.page('智能体详情',content,{back:'agents.html'})}
</script></body></html>
