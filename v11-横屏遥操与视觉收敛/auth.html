<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 镋钯机器人</title><link rel="stylesheet" href="assets/full-app.css"></head><body><script src="assets/device-flow.js"></script><div class="auth-wrap"><div class="auth-brand"><div class="auth-mark" id="mark"></div><strong>镋钯机器人</strong></div><p class="auth-kicker">机器人管理平台</p><h1>欢迎回来</h1><p class="subtle">登录后继续管理机器人、智能体与任务。</p><div class="segment" id="tabs"><button class="active" data-tab="account">账号登录</button><button data-tab="phone">手机号登录</button></div><form id="loginForm" style="margin-top:22px"><div id="accountFields"><label class="form-field"><span>账号</span><input class="form-input" id="account" autocomplete="username" placeholder="请输入账号"></label><label class="form-field"><span>密码</span><input class="form-input" id="password" type="password" autocomplete="current-password" placeholder="请输入密码"></label></div><div id="phoneFields" hidden><label class="form-field"><span>手机号</span><input class="form-input" id="phone" inputmode="tel" maxlength="11" placeholder="请输入 11 位手机号"></label><label class="form-field"><span>验证码</span><div class="inline-row"><input class="form-input" id="code" inputmode="numeric" maxlength="6" placeholder="6 位验证码"><button type="button" class="button secondary" id="getCode">获取验证码</button></div></label></div><label class="tiny" style="display:flex;align-items:flex-start;gap:9px;margin:12px 0 22px"><input id="agree" type="checkbox" style="accent-color:#ff6937;margin-top:3px"><span>我已阅读并同意《用户协议》和《隐私政策》</span></label><button class="button primary block" type="submit">进入演示工作台</button></form><div class="button-row" style="margin-top:14px"><button class="button secondary" id="scanLogin" type="button">扫码登录</button><a class="button secondary" href="register.html">创建租户</a></div><div id="authToast" class="flow-toast" role="status" hidden></div></div><script>
const $=id=>document.getElementById(id);$('mark').innerHTML=Fleet.icon('robot',24);let tab='account',timer;
function message(text){$('authToast').textContent=text;$('authToast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('authToast').hidden=true,3000)}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));$('accountFields').hidden=tab!=='account';$('phoneFields').hidden=tab!=='phone'});
$('getCode').onclick=()=>{if(!/^1\d{10}$/.test($('phone').value.trim()))return message('请先填写 11 位手机号');message('验证码服务未连接')};
$('scanLogin').onclick=()=>message('扫码登录尚未接入，当前可使用演示登录');
$('loginForm').onsubmit=e=>{e.preventDefault();if(!$('agree').checked)return message('请先同意用户协议和隐私政策');if(tab==='account'&&(!$('account').value.trim()||!$('password').value))return message('请输入账号和密码');if(tab==='phone'&&(!/^1\d{10}$/.test($('phone').value.trim())||!/^\d{6}$/.test($('code').value.trim())))return message('请填写手机号和 6 位验证码');location.href='home.html'};
</script></body></html>
