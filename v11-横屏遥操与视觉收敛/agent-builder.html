<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>智能体配置 · 镋钯机器人</title><link rel="stylesheet" href="assets/full-app.css"></head><body><script src="assets/device-flow.js"></script><script src="assets/full-app.js"></script><script>
const {$,page,toast,get,set,esc,icon}=AppUI;const id=new URLSearchParams(location.search).get('agent');
const base={xy:{id:'xy',name:'晓雅',glyph:'😊',role:'迎宾接待',desc:'热情、耐心的迎宾大使，主动问候并引导访客。',opening:'欢迎光临～',docs:['展厅话术.docx','迎宾FAQ.pdf'],model:'GPT-4o',voice:'晓雅',bound:3},ay:{id:'ay',name:'阿远',glyph:'🧑‍🏫',role:'展厅讲解',desc:'专业沉稳，随行讲解展厅内容与产品卖点。',opening:'欢迎参观～',docs:['产品手册.pdf'],model:'通义千问',voice:'阿远',bound:2},yf:{id:'yf',name:'云帆',glyph:'🤖',role:'通用助手',desc:'稳重周到的通用助手，处理日常咨询。',opening:'您好，有什么可以帮您？',docs:['通用话术.docx'],model:'DeepSeek-V3',voice:'默认音色',bound:0},dd:{id:'dd',name:'点点',glyph:'🦊',role:'儿童互动',desc:'俏皮温柔，擅长与儿童游戏互动。',opening:'我们一起来玩吧！',docs:[],model:'',voice:'',bound:0}};
const saved=get('agents',[]),existing=saved.find(a=>a.id===id)||base[id]||null;let docs=[...(existing?.docs||[])],glyph=existing?.glyph||'😊';
const local=(()=>{try{return localStorage.getItem('robops.mode')==='local'}catch(e){return false}})();
if(local){page('智能体配置',`<div class="activation-success"><div class="empty-mark">${icon('agent',34)}</div><h2>本地模式暂不可配置智能体</h2><p>知识库、模型和声音依赖云端能力。</p><a class="button primary block" href="server-connection.html">查看连接方式</a></div>`,{back:'agents.html'})}else{
const body=`<p class="page-lead"></p>${Fleet.section('基础信息',`<div class="panel" style="padding:16px"><span class="field-title">形象</span><div class="pill-row" id="glyphs">${['😊','🧑‍🏫','🦊','🤖','🧸','🌟'].map(g=>`<button class="avatar-pick ${glyph===g?'active':''}" data-glyph="${g}">${g}</button>`).join('')}</div><label class="form-field" style="margin-top:17px"><span>智能体名称</span><input class="form-input" id="name" maxlength="20" placeholder="例如：晓雅" value="${esc(existing?.name||'')}"></label><label class="form-field"><span>应用场景</span><input class="form-input" id="role" maxlength="25" placeholder="例如：迎宾接待" value="${esc(existing?.role||'')}"></label><label class="form-field"><span>人设描述</span><textarea class="form-textarea" id="desc" maxlength="160" placeholder="描述角色与交流方式">${esc(existing?.desc||'')}</textarea></label><label class="form-field" style="margin-bottom:0"><span>开场白</span><input class="form-input" id="opening" maxlength="80" placeholder="机器人主动问候时说什么" value="${esc(existing?.opening||'')}"></label></div>`)}${Fleet.section('知识库',`<div class="panel" style="padding:16px"><div id="docs"></div><div class="button-row"><button class="button secondary" type="button" id="upload">上传文档</button><button class="button secondary" type="button" id="sample">加入示例</button></div><input id="fileInput" type="file" accept=".doc,.docx,.pdf" multiple hidden><p class="form-help">支持文档与 PDF</p></div>`)}${Fleet.section('对话模型',`<div class="panel" style="padding:16px"><label class="form-field"><span>模型</span><select class="form-input" id="model"><option value="">请选择</option><option>GPT-4o</option><option>通义千问</option><option>DeepSeek-V3</option><option>自定义模型</option></select></label><label class="form-field"><span>接口密钥</span><div class="inline-row"><input class="form-input" id="apiKey" type="password" autocomplete="off" placeholder="仅作页面演示"><button class="button secondary" id="testKey" type="button">测试</button></div></label><p class="form-help">密钥不会保存</p></div>`)}${Fleet.section('声音',`<div class="panel" style="padding:16px"><label class="form-field" style="margin:0"><span>音色</span><select class="form-input" id="voice"><option value="">请选择</option><option>晓雅</option><option>阿远</option><option>云帆</option><option>默认音色</option></select></label><button class="text-button" type="button" id="voiceClone">＋ 新建声音克隆</button></div>`)}${existing?.bound?`<div class="notice info">${icon('robot')}<div>当前有 ${existing.bound} 台机器人使用这个智能体。更换绑定请到对应机器人的“遥操与模式”中操作。</div></div>`:''}<div class="button-row"><a class="button secondary" href="agents.html">取消</a><button class="button primary" id="save">${existing?'保存修改':'创建智能体'}</button></div>`;
page(existing?'编辑智能体':'创建智能体',body,{back:'agents.html'});
$('model').value=existing?.model||'';$('voice').value=existing?.voice||'';
function renderDocs(){$('docs').innerHTML=docs.length?docs.map((d,i)=>`<div class="info-row" style="padding-inline:0"><span>${icon('file',16)} ${esc(d)}</span><button class="text-button" data-remove="${i}" type="button">移除</button></div>`).join(''):'<p class="tiny">尚未添加文档</p>';document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{docs.splice(Number(b.dataset.remove),1);renderDocs()})}renderDocs();
document.querySelectorAll('[data-glyph]').forEach(b=>b.onclick=()=>{glyph=b.dataset.glyph;document.querySelectorAll('[data-glyph]').forEach(x=>x.classList.toggle('active',x===b))});
$('upload').onclick=()=>$('fileInput').click();$('fileInput').onchange=e=>{docs.push(...[...e.target.files].map(f=>f.name));renderDocs()};$('sample').onclick=()=>{if(!docs.includes('展厅话术示例.docx'))docs.push('展厅话术示例.docx');renderDocs()};
$('testKey').onclick=()=>toast('模型服务未连接');$('voiceClone').onclick=()=>toast('声音克隆需要录音服务，当前仅展示入口');
$('save').onclick=()=>{const name=$('name').value.trim(),role=$('role').value.trim();if(!name||!role){toast('请填写名称和应用场景');return}const next={id:existing?.id||'agent-'+Date.now(),name,glyph,role,desc:$('desc').value.trim(),opening:$('opening').value.trim(),docs:[...docs],model:$('model').value,voice:$('voice').value,bound:existing?.bound||0,ready:!!(docs.length&&$('model').value&&$('voice').value)};const all=get('agents',[]).filter(a=>a.id!==next.id);all.unshift(next);set('agents',all);location.href='agents.html'};
}
</script></body></html>
