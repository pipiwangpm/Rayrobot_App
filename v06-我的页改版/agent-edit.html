<!DOCTYPE html>
<html class="w-full h-full overflow-hidden" lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width,initial-scale=1.0" name="viewport" />
    <title>新建智能体 · RoboOps V2</title>
    <script src="https://modao.cc/agent-py/static/source/js/tailwindcss.js"></script>
    <script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.js"></script>
    <script src="mode.js"></script>
  </head>

<body class="w-full h-full m-0 overflow-hidden flex items-center justify-center bg-slate-950 text-slate-100">
    <maindata-c class="w-full h-full max-w-[393px] max-h-[852px] overflow-hidden flex flex-col bg-slate-950 relative">
        <header class="px-5 pt-7 pb-3">
            <div class="flex items-center gap-3">
                <a data-c href="agents.html" class="text-slate-400"><iconify-icon icon="solar:arrow-left-linear"
                        width="22"></iconify-icon></a>
                <h1 class="text-xl font-bold">智能体 · 基础信息</h1>
                <button onclick="toast('编辑模式：修改后保存即可覆盖')" class="ml-auto text-xs text-slate-500"><iconify-icon
                        icon="solar:pen-linear" width="16"></iconify-icon> 编辑已有</button>
            </div>
            <p class="mt-1 text-[11px] text-slate-500">第 1 步/共 4 步（人设）· 知识库、大模型、声纹克隆见 <a href="agent-builder.html"
                    class="text-cyan-300 underline">完整配置</a></p>
        </header>

        <section
            class="flex-1 min-h-0 overflow-y-auto overflow-x-hidden [scrollbar-width:none] [&::-webkit-scrollbar]:hidden px-5 pb-6 space-y-4">
            <!-- 实时预览 -->
            <div class="rounded-2xl bg-slate-900 p-4 flex items-center gap-3">
                <span id="pvAvatar"
                    class="w-12 h-12 rounded-2xl bg-cyan-500/15 flex items-center justify-center text-2xl">😊</span>
                <div class="flex-1 min-w-0">
                    <p id="pvName" class="font-semibold text-sm">未命名智能体</p>
                    <p id="pvLine" class="mt-0.5 text-[11px] text-slate-500">这是默认开场白～</p>
                </div>
                <span class="text-[10px] text-cyan-300">自主交互使用</span>
            </div>

            <!-- 头像 -->
            <div class="rounded-2xl bg-slate-900 p-4">
                <p class="text-sm font-semibold">头像</p>
                <div class="mt-3 flex gap-3">
                    <button onclick="pickEmoji(this)" class="w-11 h-11 rounded-xl bg-cyan-400/15 text-xl">😊</button>
                    <button onclick="pickEmoji(this)" class="w-11 h-11 rounded-xl bg-slate-800 text-xl">🧑‍🏫</button>
                    <button onclick="pickEmoji(this)" class="w-11 h-11 rounded-xl bg-slate-800 text-xl">🦊</button>
                    <button onclick="pickEmoji(this)" class="w-11 h-11 rounded-xl bg-slate-800 text-xl">🤖</button>
                    <button onclick="pickEmoji(this)" class="w-11 h-11 rounded-xl bg-slate-800 text-xl">🧸</button>
                    <button onclick="pickEmoji(this)" class="w-11 h-11 rounded-xl bg-slate-800 text-xl">🌟</button>
                </div>
            </div>

            <!-- 名称 -->
            <div class="rounded-2xl bg-slate-900 p-4">
                <p class="text-sm font-semibold">名称 <span class="ml-1 text-[10px] text-slate-500 font-normal">必填</span>
                </p>
                <input id="inName" oninput="pvName.textContent=this.value||'未命名智能体'" placeholder="如：晓雅"
                    class="mt-2 w-full rounded-xl bg-slate-800 px-3 py-2.5 text-sm placeholder:text-slate-600 outline-none" />
            </div>

            <!-- 性格 -->
            <div class="rounded-2xl bg-slate-900 p-4">
                <p class="text-sm font-semibold">性格 <span class="ml-1 text-[10px] text-slate-500 font-normal">可多选，最多 3
                        个</span></p>
                <div id="traits" class="mt-2 flex flex-wrap gap-2">
                    <button onclick="trait(this)"
                        class="t rounded-full bg-cyan-400 text-slate-950 px-3 py-1.5 text-xs">热情</button>
                    <button onclick="trait(this)"
                        class="t rounded-full bg-slate-800 text-slate-300 px-3 py-1.5 text-xs">活泼</button>
                    <button onclick="trait(this)"
                        class="t rounded-full bg-slate-800 text-slate-300 px-3 py-1.5 text-xs">稳重</button>
                    <button onclick="trait(this)"
                        class="t rounded-full bg-slate-800 text-slate-300 px-3 py-1.5 text-xs">温柔</button>
                    <button onclick="trait(this)"
                        class="t rounded-full bg-slate-800 text-slate-300 px-3 py-1.5 text-xs">幽默</button>
                    <button onclick="trait(this)"
                        class="t rounded-full bg-slate-800 text-slate-300 px-3 py-1.5 text-xs">专业</button>
                </div>
            </div>

            <!-- 人设/开场白 -->
            <div class="rounded-2xl bg-slate-900 p-4">
                <p class="text-sm font-semibold">一句话人设 & 开场白</p>
                <textarea id="inLine" oninput="pvLine.textContent=this.value||'这是默认开场白～'" rows="2"
                    placeholder="如：热情、耐心的迎宾大使，欢迎光临～"
                    class="mt-2 w-full rounded-xl bg-slate-800 px-3 py-2.5 text-sm placeholder:text-slate-600 outline-none resize-none"></textarea>
                <p class="mt-2 text-[11px] text-slate-600">知识库(docx/pdf)、大模型(APIKey)、声纹克隆属资源组装，请在「完整配置」中完成</p>
            </div>

            <!-- 绑定提示 -->
            <div class="rounded-2xl border border-cyan-400/20 bg-cyan-500/5 p-4">
                <p class="text-sm font-semibold text-cyan-200">绑定方式</p>
                <p class="mt-1.5 text-[11px] leading-5 text-slate-400">
                    创建后到「设备控制」页，把某台设备的自主交互切换到该智能体即可；脚本任务内的「虚拟角色」也会引用智能体人设。</p>
            </div>
        </section>

        <!-- 底部操作栏 -->
        <div class="h-24 shrink-0 border-t border-slate-800 px-5 py-3 flex items-center gap-3">
            <button onclick="location.href='agents.html'" class="rounded-xl bg-slate-800 px-4 py-3 text-sm">取消</button>
            <button onclick="save()"
                class="flex-1 rounded-xl bg-cyan-500 text-slate-950 py-3 text-sm font-semibold">保存并创建</button>
        </div>
        <div id="toast"
            class="hidden absolute bottom-24 left-5 right-5 bg-emerald-500 text-slate-950 font-semibold rounded-xl p-3 text-center text-sm">
        </div>
    </main>
    <!-- 本地模式：仅云（智能体向导） -->
    <div data-l class="w-full h-full max-w-[393px] max-h-[852px] flex flex-col items-center justify-center bg-slate-950 text-center px-10">
      <span class="w-16 h-16 rounded-3xl bg-slate-900 flex items-center justify-center"><iconify-icon icon="solar:chat-round-dots-linear" width="30" class="text-slate-500"></iconify-icon></span>
      <h2 class="mt-5 text-lg font-bold text-slate-200">智能体仅云模式可用</h2>
      <p class="mt-2 text-xs leading-5 text-slate-500">智能体（人设/知识库/大模型/声纹）依赖云端编排。本地模式下不可用。</p>
      <button onclick="goMode('cloud')" class="mt-6 rounded-xl bg-cyan-500 text-slate-950 px-6 py-3 text-sm font-semibold">切回云模式</button>
    </div>

    <script>
        let emoji = '😊', sel = 1;
        function pickEmoji(x) {
            emoji = x.textContent;
            x.parentElement.querySelectorAll('button').forEach(b => b.className = 'w-11 h-11 rounded-xl text-xl ' + (b === x ? 'bg-cyan-400/15' : 'bg-slate-800'));
            pvAvatar.textContent = emoji
        }
        function trait(x) {
            const on = x.classList.contains('bg-cyan-400');
            if (!on && document.querySelectorAll('#traits .bg-cyan-400').length >= 3) { alert('最多选 3 个性格'); return }
            x.classList.toggle('bg-cyan-400'); x.classList.toggle('text-slate-950');
            x.classList.toggle('bg-slate-800'); x.classList.toggle('text-slate-300')
        }
        function save() {
            const n = inName.value.trim();
            if (!n) { alert('请给智能体起个名字'); return }
            toast.textContent = '智能体「' + n + '」已创建';
            toast.classList.remove('hidden');
            setTimeout(() => { toast.classList.add('hidden'); location.href = 'agents.html' }, 1200)
        }
    </script>
</body>

</html>
