<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>机器人详情 · 镋钯</title><link rel="stylesheet" href="assets/device-flow.css"><link rel="stylesheet" href="assets/phone-frame-v18.css"><link rel="stylesheet" href="assets/device-v19.css"></head>
<body><script src="assets/device-flow.js"></script><script>
const {device:d,href,icon,esc,shell,toast,confirmAction,$}=Fleet;
const offline=d.state==='offline',fault=d.state==='fault';
const conn=d.connection?`${icon(d.connection,16)}<span>${d.connection==='wifi'?'Wi-Fi':'AP 局域网'}</span><strong>${d.signal>=4?'强':d.signal>=2?'中':'弱'}</strong>`:`${icon('wifi',16)}<span>未连接</span>`;
const battery=d.battery===null?'—':d.battery+'%';
const hero=`<section class="detail-hero ${esc(d.state)}">
  <div class="detail-head"><span class="state-pill ${esc(d.state)}">${esc(d.status)}</span></div>
  <h1>${esc(d.name)}</h1><p class="detail-model">${esc(d.model)}</p>
  <img class="detail-watermark" src="assets/${esc(d.image)}" alt="${esc(d.color)}机器人外观">
  <div class="detail-specs">
    <div><span>序列号</span><strong>${esc(d.sn)}</strong></div>
    <div><span>网络地址</span><strong>${esc(d.ip)}</strong></div>
    <div><span>所属分组</span><strong>${esc(d.group)}</strong></div>
    <div><span>当前任务</span><strong>${esc(d.task)}</strong></div>
    <div><span>关联智能体</span><strong>${esc(d.agent)}</strong></div>
    <div class="detail-location"><span>当前位置</span><a href="${href('robot-map')}" aria-label="在地图上查看${esc(d.name)}的位置"><strong>${esc(d.group)}</strong>${icon('pin',15)}</a></div>
  </div>
  <div class="detail-status">
    <div class="detail-battery ${d.battery!==null&&d.battery<=25?'low':''}">
      <span class="battery-shell" style="--charge:${d.battery??0}%"><i></i></span>
      <span class="battery-copy"><strong>${battery}</strong></span>
    </div>
    <div class="detail-connection">${conn}</div>
  </div>
</section>`;
const notice=fault?`<div class="notice">${icon('alert')}<div>机器人存在故障，请查看“关于本机”中的运行信息。</div></div>`:offline?`<div class="notice info">${icon('wifi')}<div>机器人离线，遥操与监控暂不可用。</div></div>`:'';
const tile=(page,label,glyph,detail,disabled=false,primary=false)=>`<a class="control-tile ${primary?'primary-tile':''} ${disabled?'is-disabled':''}" href="${href(page)}" ${disabled?'aria-disabled="true" tabindex="-1"':''}>${icon(glyph,22)}<strong>${label}</strong><small>${detail}</small></a>`;
const command=`<section class="flow-section"><div class="section-head"><h2>控制</h2></div><div class="control-grid">
${tile('remote-control','遥操','control','方向与移动',offline||fault,true)}
${tile('task-execution','任务执行','task','选择并执行任务',offline||fault)}
${tile('control','模式切换','power','切换运行模式',offline||fault)}
${tile('monitor','远程监控','video','查看实时画面',offline)}
</div></section>`;
const menus=`<section class="flow-section"><div class="section-head"><h2>设置</h2></div><div class="menu-panel"><a class="menu-link" href="${href('device-settings')}"><span class="menu-icon">${icon('settings')}</span><span><strong>基础参数</strong></span><span class="chevron">›</span></a><a class="menu-link" href="${href('server-connection')}"><span class="menu-icon">${icon('wifi')}</span><span><strong>连接方式</strong></span><span class="chevron">›</span></a><a class="menu-link" href="${href('about-machine')}"><span class="menu-icon">${icon('robot')}</span><span><strong>关于本机</strong></span><span class="chevron">›</span></a><a class="menu-link" href="${href('robot-tools')}"><span class="menu-icon">${icon('more')}</span><span><strong>更多操作</strong></span><span class="chevron">›</span></a></div></section>`;
const stop=`<button class="emergency-link" id="stop" ${offline?'disabled':''}>${icon('alert',16)}紧急停止</button>`;
shell('机器人详情',hero+notice+command+menus+stop,'<span class="head-spacer" aria-hidden="true"></span>');
$('stop').onclick=()=>confirmAction('确认紧急停止？','此操作将停止机器人活动，请确认机器人状态安全。',()=>toast('操作已确认'));
</script></body></html>
