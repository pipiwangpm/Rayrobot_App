<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>智能体基础信息 · 镋钯机器人</title><link rel="stylesheet" href="assets/full-app.css"><link rel="stylesheet" href="assets/phone-frame-v18.css"></head><body><script src="assets/device-flow.js"></script><script src="assets/full-app.js"></script><script>
const {$,page,toast,get,set,esc,icon}=AppUI;let glyph='😊',traits=[];
const body=`<p class="page-lead">先设定角色与说话方式，后续可继续配置知识库、模型和声音。</p>${Fleet.section('角色形象',`<div class="pill-row" id="glyphs">${['😊','🧑‍🏫','🦊','🤖','🧸','🌟'].map(g=>`<button class="avatar-pick ${g===glyph?'active':''}" data-glyph="${g}">${g}</button>`).join('')}</div>`)}${Fleet.section('基础信息',`<label class="form-field"><span>智能体名称</span><input class="form-input" id="name" maxlength="20" placeholder="例如：晓雅"></label><label class="form-field"><span>应用场景</span><input class="form-input" id="role" maxlength="25" placeholder="例如：迎宾接待"></label><label class="form-field"><span>一句话人设</span><textarea class="form-textarea" id="desc" maxlength="160" placeholder="描述角色与交流方式"></textarea></label>`)}${Fleet.section('性格标签',`<div class="pill-row" id="traits">${['热情','活泼','稳重','温柔','幽默','专业'].map(t=>`<button class="pill" data-trait="${t}">${t}</button>`).join('')}</div>`)}<div class="button-row" style="margin-top:26px"><a class="button secondary" href="agents.html">取消</a><button class="button primary" id="save">保存并继续</button></div>`;
page('智能体基础信息',body,{back:'agents.html'});document.querySelectorAll('[data-glyph]').forEach(b=>b.onclick=()=>{glyph=b.dataset.glyph;document.querySelectorAll('[data-glyph]').forEach(x=>x.classList.toggle('active',x===b))});document.querySelectorAll('[data-trait]').forEach(b=>b.onclick=()=>{const t=b.dataset.trait;traits=traits.includes(t)?traits.filter(x=>x!==t):[...traits,t];b.classList.toggle('active',traits.includes(t))});$('save').onclick=()=>{const name=$('name').value.trim(),role=$('role').value.trim();if(!name||!role){toast('请填写名称和应用场景');return}const id='agent-'+Date.now(),a={id,name,glyph,role,desc:$('desc').value.trim()+(traits.length?' · '+traits.join('、'):''),opening:'',docs:[],model:'',voice:'',bound:0,ready:false};const all=get('agents',[]);all.unshift(a);set('agents',all);location.href='agent-builder.html?agent='+encodeURIComponent(id)};
</script></body></html>
