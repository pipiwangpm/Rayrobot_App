<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>系统设置 · 镋钯机器人</title><link rel="stylesheet" href="assets/full-app.css"></head><body><script src="assets/device-flow.js"></script><script src="assets/full-app.js"></script><script>
const {$,page,toast,icon}=AppUI;let mode='always';try{mode=localStorage.getItem('robops.imgMode')||'always'}catch(e){}
const body=`<p class="page-lead">设置当前手机上的显示与流量偏好。</p>${Fleet.section('媒体与流量',`<div class="panel" id="imageOptions"><label class="toggle-row"><span><strong>始终加载机器人图片</strong><small>任何网络都展示完整外观图</small></span><input type="radio" name="img" value="always"></label><label class="toggle-row"><span><strong>仅 Wi-Fi 加载</strong><small>使用移动网络时显示轻量占位</small></span><input type="radio" name="img" value="wifi"></label><label class="toggle-row"><span><strong>关闭自动加载</strong><small>手动查看图片，节省流量</small></span><input type="radio" name="img" value="off"></label></div>`)}${Fleet.section('关于应用',`<div class="panel">${Fleet.row('应用名称','镋钯机器人')}${Fleet.row('原型版本','V09')}${Fleet.row('更新状态','演示版本')}</div>`)}<div class="notice info">${icon('robot')}<div>这里的设置只影响本机原型预览。机器人侧参数请进入对应机器人的设置页。</div></div>`;
page('系统设置',body,{back:'profile.html'});const current=document.querySelector(`input[name="img"][value="${mode}"]`)||document.querySelector('input[name="img"]');current.checked=true;document.querySelectorAll('input[name="img"]').forEach(r=>r.onchange=()=>{try{localStorage.setItem('robops.imgMode',r.value)}catch(e){}toast('图片加载偏好已保存')});
</script></body></html>
