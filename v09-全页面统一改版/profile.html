<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111518">
<title>我的 · 镋钯机器人</title>
<style>
:root{color-scheme:dark;--bg:#111518;--panel:#1c2328;--line:#344048;--text:#f2f4f4;--muted:#9aa8b1;--orange:#ff6635;--green:#5de4a4;--red:#ff8589}
*{box-sizing:border-box}body{margin:0;background:#080b0e;color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit}a{color:inherit;text-decoration:none}button,a,input{-webkit-tap-highlight-color:transparent}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--orange);outline-offset:3px}svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}h1,h2,p{margin:0}
.app{max-width:460px;min-height:100dvh;margin:auto;padding-bottom:93px;position:relative;overflow:hidden;background:var(--bg);border-left:1px solid #20272b;border-right:1px solid #20272b}.top{padding:30px 22px 24px;position:relative;background:radial-gradient(ellipse at 95% -22%,#473024 0,transparent 55%)}.eyebrow{font:10px/1.4 ui-monospace,SFMono-Regular,monospace;letter-spacing:2px;color:#a0a9ae}.topline{display:flex;justify-content:space-between;align-items:center;margin-top:7px}h1{font-size:28px;font-weight:650;letter-spacing:1px}.deployment{display:flex;align-items:center;gap:6px;font-size:11px;color:#aab5bc;border:1px solid #425058;border-radius:30px;padding:5px 9px;background:#222b2f}.deployment i{width:6px;height:6px;background:var(--green);border-radius:50%;box-shadow:0 0 8px #5de4a488}.intro{color:#9eabb4;font-size:13px;margin-top:5px}.content{padding:0 16px 28px}
.identity{border:1px solid #3c464d;border-radius:16px;background:linear-gradient(135deg,#293037 0%,#1b2227 70%);padding:19px;position:relative;overflow:hidden}.identity:before{content:"";position:absolute;top:0;left:19px;width:31px;height:2px;background:var(--orange)}.identity:after{content:"";position:absolute;width:175px;height:175px;right:-80px;top:-86px;border:1px solid #ffffff10;border-radius:50%;box-shadow:0 0 0 24px #ffffff05,0 0 0 53px #ffffff04;pointer-events:none}.identity-head{display:flex;align-items:center;gap:14px;position:relative;z-index:1}.avatar{width:60px;height:60px;border:1px solid #63727b;border-radius:13px;background:linear-gradient(145deg,#424d53,#263037);display:grid;place-items:center;font-size:26px;font-weight:600;color:#f0f3f3;box-shadow:inset 0 0 0 4px #222a2f}.identity-copy{flex:1;min-width:0}.identity-copy h2{font-size:20px;line-height:1.25;font-weight:650}.identity-copy p{font-size:12px;color:#aebbc3;margin-top:5px}.edit{width:36px;height:36px;border:1px solid #526069;background:#263039;border-radius:9px;display:grid;place-items:center;position:relative;z-index:2}.edit svg{width:16px;height:16px}.identity-rule{height:1px;background:#3e4950;margin:19px 0 14px}.org-label{font-size:10px;color:#82919b;letter-spacing:1.3px;font-family:ui-monospace,monospace}.org-value{font-size:13px;margin-top:4px;color:#d7dee2}.permission{display:inline-flex;align-items:center;gap:6px;margin-top:14px;border:1px solid #6b513b;color:#eec19d;background:#3a2b22;border-radius:5px;padding:4px 8px;font-size:11px}.permission svg{width:13px;height:13px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;margin:26px 5px 10px}.section-head h2{font-size:13px;font-weight:600;letter-spacing:.4px}.section-head small{font:9px ui-monospace,monospace;letter-spacing:1.5px;color:#7d8990}.menu{border:1px solid #354047;background:linear-gradient(120deg,#222a30,#1b2227);border-radius:13px;overflow:hidden}.row{min-height:59px;padding:0 15px;display:flex;align-items:center;gap:13px}.row+.row{border-top:1px solid #344047}.row .glyph{width:31px;height:31px;border:1px solid #46535b;border-radius:8px;display:grid;place-items:center;color:#c4d0d5;background:#2a3339}.row .glyph svg{width:17px;height:17px}.row strong{font-size:13px;font-weight:500;flex:1}.row .meta{font-size:11px;color:#93a3ad;white-space:nowrap}.row .meta.success{color:var(--green)}.row .chevron{color:#75848d;width:15px;height:15px}.row:active{background:#2b353b}.logout{width:100%;background:none;text-align:left;border:0;color:#f4b4ad}.logout .glyph{color:#eaa6a3;border-color:#76504f;background:#382a2c}.logout strong{color:#f4b4ad}.footnote{color:#6f7b83;font:10px/1.5 ui-monospace,monospace;letter-spacing:.8px;text-align:center;margin:26px 0 3px}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(460px,100%);z-index:10;display:flex;background:#141a1ef2;backdrop-filter:blur(18px);border-top:1px solid #343d44;padding:11px 8px calc(12px + env(safe-area-inset-bottom))}.bottom-nav a{flex:1;min-height:44px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;color:#8e9ba5}.bottom-nav a.active{color:var(--orange)}.bottom-nav svg{width:21px;height:21px}
.backdrop{position:fixed;inset:0;background:#000b;z-index:30;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}.sheet{width:min(460px,100%);background:#20282e;border:1px solid #455159;border-radius:22px 22px 0 0;padding:12px 22px calc(24px + env(safe-area-inset-bottom));max-height:85dvh;overflow:auto;box-shadow:0 -25px 80px #0005}.handle{width:36px;height:4px;border-radius:4px;background:#5a656c;margin:0 auto 20px}.sheet-head{display:flex;justify-content:space-between;align-items:center}.sheet-head h2{font-size:20px;font-weight:600}.close{border:0;background:#354149;width:34px;height:34px;border-radius:50%;font-size:22px}.sheet p{font-size:12px;color:#9faeb8;margin:9px 0 17px;line-height:1.65}.field{display:block;color:#bdc7cd;margin:15px 0 7px;font-size:12px}.sheet input{width:100%;background:#141c22;border:1px solid #4a5963;border-radius:8px;min-height:44px;padding:11px;color:#f0f4f6}.sheet-actions{display:flex;gap:10px;margin-top:24px}.secondary,.primary{min-height:44px;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600}.secondary{border:1px solid #56636b;background:#2b353c;flex:1}.primary{border:1px solid var(--orange);background:var(--orange);color:#171b1e;flex:1}.toast{position:fixed;left:50%;bottom:105px;transform:translateX(-50%);padding:11px 17px;max-width:calc(100vw - 30px);white-space:nowrap;border:1px solid #58646d;border-radius:9px;background:#303b43;box-shadow:0 8px 35px #0009;z-index:50;font-size:12px}[hidden]{display:none!important}
html[data-mode="local"] [data-c]{display:none!important}html:not([data-mode="local"]) [data-l]{display:none!important}
@media(min-width:650px){.app{margin:28px auto;min-height:calc(100dvh - 56px);border-radius:24px;box-shadow:0 30px 120px #000b}.top{padding-top:28px}}@media(max-width:360px){.top{padding-left:17px;padding-right:17px}.content{padding-left:12px;padding-right:12px}.identity{padding:16px}.row{padding:0 12px;gap:10px}}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="topline"><h1>我的</h1><span class="deployment"><i></i><span id="deploymentText">云端连接</span></span></div><p class="intro">账户信息与偏好设置</p></header>
  <main class="content">
    <section class="identity" aria-label="个人资料"><div class="identity-head"><div class="avatar" id="avatar">赵</div><div class="identity-copy"><h2 id="profileName">赵楷</h2><p id="profileRole">现场运营专员</p></div><button class="edit" id="editProfile" aria-label="编辑个人资料" title="编辑个人资料" type="button"><span data-icon="edit"></span></button></div><div class="identity-rule"></div><div class="org-label">所属机构</div><div class="org-value" id="profileOrg">成都人形机器人创新中心</div><span class="permission"><span data-icon="shield"></span>机器人运营权限</span></section>
    <section aria-labelledby="connectionTitle"><div class="section-head"><h2 id="connectionTitle">通知与连接</h2></div><div class="menu">
      <a class="row" href="notification-settings.html"><span class="glyph" data-icon="bell"></span><strong>通知设置</strong><span class="meta">已开启</span><span class="chevron" data-icon="chevron"></span></a>
      <a class="row" href="server-connection.html"><span class="glyph" data-icon="server"></span><strong>连接与部署形态</strong><span class="meta success" id="connectionMode">云端</span><span class="chevron" data-icon="chevron"></span></a>
      <a class="row" href="lan-direct.html"><span class="glyph" data-icon="wifi"></span><strong>局域网直连</strong><span class="meta">权限可用</span><span class="chevron" data-icon="chevron"></span></a>
    </div></section>
    <section aria-labelledby="systemTitle"><div class="section-head"><h2 id="systemTitle">系统</h2></div><div class="menu"><a class="row" href="system-settings.html"><span class="glyph" data-icon="settings"></span><strong>系统设置</strong><span class="meta" id="imgModeLabel">机器人图 · 始终加载</span><span class="chevron" data-icon="chevron"></span></a></div></section>
    <section aria-labelledby="helpTitle"><div class="section-head"><h2 id="helpTitle">帮助与安全</h2></div><div class="menu"><a class="row" href="about.html"><span class="glyph" data-icon="book"></span><strong>教程与关于</strong><span class="chevron" data-icon="chevron"></span></a><button class="row logout" type="button" id="logout"><span class="glyph" data-icon="logout"></span><strong>退出当前账户</strong><span class="chevron" data-icon="chevron"></span></button></div></section>
    
  </main>
  <nav class="bottom-nav" aria-label="主导航"><a href="home.html" data-icon="grid">机器人</a><a href="agents.html" data-c data-icon="agent">智能体</a><a href="alerts.html" data-icon="bell">消息</a><a href="task-center.html" data-icon="task">任务</a><a href="profile.html" class="active" aria-current="page" data-icon="user">我的</a></nav>
</div>
<div class="backdrop" id="backdrop" hidden><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1"><div class="handle"></div><div class="sheet-head"><h2 id="sheetTitle"></h2><button class="close" type="button" id="closeSheet" aria-label="关闭">×</button></div><div id="sheetBody"></div></section></div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
const paths={edit:'<path d="m4 20 4-.7L19 8.3a2.3 2.3 0 0 0-3.3-3.3L4.7 16 4 20Z"/><path d="m14.7 6 3.3 3.3"/>',shield:'<path d="M12 2 4 5v6c0 5.1 2.7 8.7 8 11 5.3-2.3 8-5.9 8-11V5l-8-3Z"/><path d="m9 12 2 2 4-4"/>',bell:'<path d="M5 16v-5a7 7 0 0 1 14 0v5l2 2H3l2-2M10 21h4"/>',server:'<rect x="3" y="3" width="18" height="8" rx="2"/><rect x="3" y="13" width="18" height="8" rx="2"/><path d="M7 7h.01M7 17h.01M11 7h6M11 17h6"/>',wifi:'<path d="M2 8a15 15 0 0 1 20 0M5 12a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="20" r="1" fill="currentColor" stroke="none"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/><circle cx="12" cy="12" r="8"/>',book:'<path d="M12 6c-2.2-1.5-5.5-1.5-9 0v14c3.5 0 6.8 0 9 1.5 2.2-1.5 5.5-1.5 9-1.5V6c-3.5 0-6.8 0-9 1.5Z"/><path d="M12 7.5v14"/>',logout:'<path d="M9 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h4M14 3h3a2 2 0 0 1 2 2v3M19 16v3a2 2 0 0 1-2 2h-3M10 12h11m-4-4 4 4-4 4"/>',chevron:'<path d="m9 5 7 7-7 7"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',agent:'<rect x="4" y="7" width="16" height="13" rx="5"/><path d="M12 3v4M8 12v2M16 12v2M9 17h6"/>',task:'<path d="m3 6 2 2 3-4M11 6h10M3 14l2 2 3-4M11 14h10M11 20h7"/>',user:'<circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>'};
const icon=name=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+paths[name]+'</svg>';
document.querySelectorAll('[data-icon]').forEach(el=>{const svg=icon(el.dataset.icon);if(el.matches('a'))el.insertAdjacentHTML('afterbegin',svg);else el.innerHTML=svg});
const $=id=>document.getElementById(id);
let mode='cloud';try{const q=new URLSearchParams(location.search).get('m');mode=q==='local'||q==='cloud'?q:localStorage.getItem('robops.mode')==='local'?'local':'cloud'}catch(e){}
document.documentElement.dataset.mode=mode;
if(mode==='local'){$('deploymentText').textContent='本地 · 内网';$('connectionMode').textContent='本地 · 内网';document.querySelectorAll('a[href$=".html"]').forEach(a=>a.href+='?m=local')}
const imgMap={always:'机器人图 · 始终加载',wifi:'机器人图 · 仅 Wi-Fi',off:'机器人图 · 不加载'};try{$('imgModeLabel').textContent=imgMap[localStorage.getItem('robops.imgMode')]||imgMap.always}catch(e){}
const defaults={name:'赵楷',role:'现场运营专员',org:'成都人形机器人创新中心'};let profile={...defaults};try{const stored=JSON.parse(localStorage.getItem('tangpa.prototype.profile')||'null');if(stored&&typeof stored==='object')for(const key of Object.keys(defaults))if(typeof stored[key]==='string'&&stored[key].trim())profile[key]=stored[key].trim()}catch(e){}
function renderProfile(){$('profileName').textContent=profile.name;$('profileRole').textContent=profile.role;$('profileOrg').textContent=profile.org;$('avatar').textContent=profile.name.charAt(0)||'赵'}renderProfile();
let lastFocus=null;function openSheet(title,body){lastFocus=document.activeElement;$('sheetTitle').textContent=title;$('sheetBody').innerHTML=body;$('backdrop').hidden=false;document.body.style.overflow='hidden';$('closeSheet').focus()}
function closeSheet(){$('backdrop').hidden=true;document.body.style.overflow='';lastFocus?.focus()}
$('closeSheet').onclick=closeSheet;$('backdrop').onclick=e=>{if(e.target===$('backdrop'))closeSheet()};
document.addEventListener('keydown',e=>{if($('backdrop').hidden)return;if(e.key==='Escape'){closeSheet();return}if(e.key==='Tab'){const nodes=[...$('backdrop').querySelectorAll('button,input')];if(e.shiftKey&&document.activeElement===nodes[0]){e.preventDefault();nodes.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===nodes.at(-1)){e.preventDefault();nodes[0].focus()}}});
let toastTimer;function toast(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,2300)}
$('editProfile').onclick=()=>{openSheet('编辑个人资料','<p>此原型中的修改仅保存在当前浏览器，用于预览页面效果。</p><form id="profileForm"><label class="field" for="nameInput">姓名</label><input id="nameInput" name="name" maxlength="20" required><label class="field" for="roleInput">岗位</label><input id="roleInput" name="role" maxlength="30" required><label class="field" for="orgInput">所属机构</label><input id="orgInput" name="org" maxlength="50" required><div class="sheet-actions"><button class="secondary" type="button" id="cancelEdit">取消</button><button class="primary" type="submit">保存资料</button></div></form>');$('nameInput').value=profile.name;$('roleInput').value=profile.role;$('orgInput').value=profile.org;$('cancelEdit').onclick=closeSheet;$('profileForm').onsubmit=e=>{e.preventDefault();const next={name:$('nameInput').value.trim(),role:$('roleInput').value.trim(),org:$('orgInput').value.trim()};if(Object.values(next).some(v=>!v))return;profile=next;try{localStorage.setItem('tangpa.prototype.profile',JSON.stringify(profile))}catch(e){}renderProfile();closeSheet();toast('资料已更新，仅用于原型预览')};$('nameInput').focus()};
$('logout').onclick=()=>{openSheet('退出当前账户','<p>确认返回登录页？此原型不会退出真实账户。</p><div class="sheet-actions"><button class="secondary" type="button" id="cancelLogout">取消</button><button class="primary" type="button" id="confirmLogout">返回登录页</button></div>');$('cancelLogout').onclick=closeSheet;$('confirmLogout').onclick=()=>location.href='auth.html'+(mode==='local'?'?m=local':'')};
</script>
</body>
</html>
