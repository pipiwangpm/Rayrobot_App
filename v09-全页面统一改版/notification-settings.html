<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>通知设置 · 镋钯机器人</title><link rel="stylesheet" href="assets/full-app.css"></head><body><script src="assets/device-flow.js"></script><script src="assets/full-app.js"></script><script>
const {$,page,toast,get,set,icon}=AppUI;const saved=get('notifications',{alerts:true,tasks:true,updates:false,quiet:false,start:'22:00',end:'08:00'});
const toggle=(id,title,desc)=>`<label class="toggle-row"><span><strong>${title}</strong><small>${desc}</small></span><input class="switch" id="${id}" type="checkbox"></label>`;
const body=`<p class="page-lead">按消息类型选择提醒方式。设置仅保存在当前浏览器。</p>${Fleet.section('消息提醒',`<div class="panel">${toggle('alerts','告警通知','机器人故障、离线和低电量')}${toggle('tasks','任务通知','下发结果和执行状态变化')}${toggle('updates','升级提醒','新版本与维护提示')}</div>`)}${Fleet.section('免打扰',`<div class="panel">${toggle('quiet','开启免打扰','在指定时段内静音普通提醒')}<div class="toggle-row"><span><strong>开始时间</strong></span><input class="form-input" id="start" type="time" style="max-width:126px"></div><div class="toggle-row"><span><strong>结束时间</strong></span><input class="form-input" id="end" type="time" style="max-width:126px"></div></div><p class="form-help">重要告警仍会显示在消息中心。</p>`)}<button class="button primary block" id="save" style="margin-top:28px">保存通知设置</button>`;
page('通知设置',body,{back:'profile.html'});for(const k of ['alerts','tasks','updates','quiet'])$(k).checked=saved[k];$('start').value=saved.start;$('end').value=saved.end;$('save').onclick=()=>{const next={start:$('start').value,end:$('end').value};for(const k of ['alerts','tasks','updates','quiet'])next[k]=$(k).checked;set('notifications',next);toast('通知偏好已保存到原型浏览器')};
</script></body></html>
