<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教程与关于 · 镋钯机器人</title><link rel="stylesheet" href="assets/full-app.css"><link rel="stylesheet" href="assets/light-theme.css"></head><body><script src="assets/device-flow.js"></script><script src="assets/full-app.js"></script><script>
const {$,page,icon}=AppUI;
const guide=(id,n,title,content)=>`<div class="guide"><button type="button" class="link-row" data-guide="${id}" aria-expanded="false"><span class="guide-number">${n}</span><span><strong>${title}</strong><small>点击查看操作说明</small></span><span class="arrow">›</span></button><div id="${id}" class="guide-body" hidden>${content}</div></div>`;
const body=`<div class="about-hero"><span class="about-mark">${icon('robot',32)}</span><h1>镋钯机器人</h1><p>面向现场运营人员的机器人管理平台</p></div>${Fleet.section('快速上手',`${guide('guide1','01','添加并连接机器人','在“机器人”页点击右上角加号，选择扫码、蓝牙或输入序列号，完成接入流程。')}${guide('guide2','02','管理运行模式','打开一台机器人，进入“遥操与模式”。故障或离线时应先核实状态，再执行操作。')}${guide('guide3','03','处理告警','在“消息”页查看故障与低电量提醒，打开对应机器人核查，再标记为已处理。')}`)}${Fleet.section('说明',`<div class="panel">${Fleet.row('当前版本','界面版本 V13')}${Fleet.row('内容范围','机器人、智能体、任务与设置')}${Fleet.row('服务连接','未连接')}</div>`)}`;
page('教程与关于',body,{back:'profile.html'});document.querySelectorAll('[data-guide]').forEach(b=>b.onclick=()=>{const panel=$(b.dataset.guide),open=panel.hidden;panel.hidden=!open;b.setAttribute('aria-expanded',String(open));b.querySelector('.arrow').textContent=open?'⌄':'›'});
</script></body></html>
