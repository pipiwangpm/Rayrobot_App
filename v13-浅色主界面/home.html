const paths={wifi:'<path d="M2 9a15 15 0 0 1 20 0M5 12a10 10 0 0 1 14 0M8.5 15a5 5 0 0 1 7 0M12 19h.01"/>',ap:'<path d="M8 20h8v-6H8zM5 13a10 10 0 0 1 14 0M2 9a15 15 0 0 1 20 0"/>',plus:'<path d="M12 5v14M5 12h14"/>',refresh:'<path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.5 7a7 7 0 0112-2L20 8M4 16l2.5 3a7 7 0 0012-2"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/>',filter:'<path d="M4 7h16M7 12h10M10 17h4"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',list:'<path d="M8 5h12M8 12h12M8 19h12M3 5h1M3 12h1M3 19h1"/>',agent:'<rect x="4" y="7" width="16" height="13" rx="5"/><path d="M12 3v4M8 12v2M16 12v2M9 17h6"/>',bell:'<path d="M5 16v-5a7 7 0 0114 0v5l2 2H3l2-2M10 21h4"/>',task:'<path d="m3 6 2 2 3-4M11 6h10M3 14l2 2 3-4M11 14h10M11 20h7"/>',user:'<circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0116 0v2"/>',video:'<rect x="3" y="5" width="13" height="14" rx="3"/><path d="m16 10 5-3v10l-5-3"/>',arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>',warn:'<path d="m12 3 10 18H2L12 3Z"/><path d="M12 9v5M12 17h.01"/>'};
const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${paths[n]||paths.agent}</svg>`;
const devices=[{id:'A03',name:'迎宾机器人 · A03',model:'镗钯-EDU',sn:'TP-A03-202609',ip:'10.2.0.31',group:'大厅 A 区',state:'online',status:'在线 · 运行中',battery:86,mode:'自主交互',agent:'晓雅',photo:true,color:0,connection:'wifi',signal:4},{id:'K12',name:'巡检机器人 · K12',model:'巡检型',sn:'KK-12-202605',ip:'10.2.0.42',group:'巡更组',state:'online',status:'在线 · 巡检中',battery:52,mode:'任务执行中',agent:'未绑定',photo:true,color:1,connection:'ap',signal:3},{id:'U2',name:'双轮足机器人 · U2',model:'双轮足测试型',sn:'DW-U2-202607',ip:'10.2.0.53',group:'研发测试',state:'fault',status:'在线 · 故障',battery:21,mode:'异常',agent:'阿远',photo:true,color:2,connection:'wifi',signal:1},{id:'D07',name:'配送机器人 · D07',model:'双轮足配送型',sn:'DW-D07-202608',ip:'—',group:'未分组',state:'offline',status:'离线',battery:null,lastSeen:'昨日 18:26',mode:'不可用',agent:'未绑定',photo:true,color:3,connection:null,signal:0}];
let showImages=true;try{const preference=localStorage.getItem('robops.imgMode');if(preference==='off'||preference==='wifi'&&navigator.connection?.type&&navigator.connection.type!=='wifi')showImages=false}catch(e){}
for(const d of devices){try{const saved=JSON.parse(localStorage.getItem('fleet-device-'+d.id)||'{}');if(saved.name)d.name=saved.name;if(saved.group)d.group=saved.group;if(saved.mode)d.mode=saved.mode;if(saved.agent)d.agent=saved.agent}catch(e){}}
let groups=['大厅 A 区','巡更组','研发测试','未分组'],group='全部',status='all',query='',compact=false,batch=false,selected=new Set(),lastFocus,timer;
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('refresh').innerHTML=icon('refresh');$('addDevice').innerHTML=icon('plus');$('searchIcon').innerHTML=icon('search');$('filter').innerHTML=icon('filter');$('cardView').innerHTML=icon('grid');$('listView').innerHTML=icon('list');document.querySelectorAll('[data-icon]').forEach(a=>a.insertAdjacentHTML('afterbegin',icon(a.dataset.icon)));
function visible(){return devices.filter(d=>(group==='全部'||d.group===group)&&(status==='all'||status==='online'&&d.state!=='offline'||status===d.state)&&[d.name,d.sn,d.ip,d.group].join(' ').toLowerCase().includes(query.toLowerCase()))}
function signalMarkup(d){if(!d.connection)return `<div class="signal-stack"><div class="signal-row">${icon('wifi')}<span>离线</span></div><small class="signal-caption">网络连接</small></div>`;const n=d.signal||0;const bars=`<span class="signal-bars level-${n}" aria-label="${n===4?'强':n>=2?'中':'弱'}信号">${[1,2,3,4].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</span><small class="signal-quality">${n>=4?'强':n>=2?'中':'弱'}</small>`;return `<div class="signal-stack" aria-label="当前连接方式"><div class="signal-row active">${icon(d.connection)}<span>${d.connection==='wifi'?'Wi-Fi':'AP'}</span>${bars}</div><small class="signal-caption">网络连接</small></div>`}

function render(){
$('groups').innerHTML=['全部',...groups].map(g=>`<button class="chip ${g===group?'selected':''}" data-group="${esc(g)}" aria-pressed="${g===group}">${esc(g)}<i>${g==='全部'?devices.length:devices.filter(d=>d.group===g).length}</i></button>`).join('')+`<button class="chip plus" id="newGroup" aria-label="新建分组">${icon('plus')}</button>`;
const list=visible();$('resultCount').innerHTML=batch?`已选 <b>${selected.size}</b> 台`:`<b>${group==='全部'?'我的机器人':esc(group)}</b> · ${list.length} 台`;
$('devices').innerHTML=list.length?list.map(d=>`<article class="device ${d.state} ${compact?'compact':''} ${selected.has(d.id)?'selected':''}" data-card="${d.id}" role="${batch?'checkbox':'link'}" tabindex="0" aria-label="${batch?'选择':'查看'}${esc(d.name)}" ${batch?`aria-checked="${selected.has(d.id)}"`:''}>${batch?`<span class="select-box ${selected.has(d.id)?'checked':''}" aria-hidden="true">✓</span>`:''}<div class="card-top"><h2 class="device-name">${esc(d.name)}</h2><div class="device-sub">${esc(d.model)}</div><div class="badge"><span class="dot"></span>${d.status}</div>${d.photo&&showImages?`<div class="robot-art robot-photo"><img src="assets/${['robot-golden-yellow.webp','robot-emerald-green.webp','robot-pearl-white.webp','robot-cobalt-blue.webp'][d.color]}" alt="${['金黄色','翡翠绿','珍珠白','钴蓝色'][d.color]}镋钯机器人外观效果图" width="1024" height="1536" loading="lazy"></div>`:`<div class="machine-mark" aria-hidden="true"><strong>${d.id}</strong></div>`}</div><div class="telemetry"><div class="battery-metric"><strong>${d.battery??'—'}${d.battery!==null?'<em>%</em>':''}</strong><div class="battery-line"><span style="width:${d.battery??0}%"></span></div><small>${d.battery===null?'电量未知':'剩余电量'}</small></div>${signalMarkup(d)}</div>${d.state==='fault'?`<div class="status-note">${icon('warn')}机器人存在故障，点击查看</div>`:''}<div class="device-bottom"><div class="mode-row"><div class="mode-info"><strong>${d.mode}</strong></div><div class="agent">${icon('agent')}${d.agent}</div></div></div></article>`).join(''):'<div class="empty">没有符合条件的机器人<button id="resetFilters">清空筛选条件</button></div>';
$('batchBar').hidden=!batch;$('batch').textContent=batch?'完成':'批量管理';$('selectedCount').innerHTML=`已选 ${selected.size} 台<small>选择机器人后统一调整分组</small>`;$('moveGroup').disabled=!selected.size;$('filter').classList.toggle('active',status!=='all');
$('groups').querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{group=b.dataset.group;render()});$('newGroup').onclick=createGroup;
$('devices').querySelectorAll('[data-card]').forEach(card=>{const open=()=>{if(batch){selected.has(card.dataset.card)?selected.delete(card.dataset.card):selected.add(card.dataset.card);render()}else location.href='device.html?id='+encodeURIComponent(card.dataset.card)};card.onclick=open;card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}}});if($('resetFilters'))$('resetFilters').onclick=reset;
}
function toast(s){clearTimeout(timer);$('toast').textContent=s;$('toast').hidden=false;timer=setTimeout(()=>$('toast').hidden=true,2600)}
function openSheet(title,html){lastFocus=document.activeElement;$('sheetTitle').textContent=title;$('sheetBody').innerHTML=html;$('backdrop').hidden=false;document.body.style.overflow='hidden';$('closeSheet').focus()}
function closeSheet(){$('backdrop').hidden=true;document.body.style.overflow='';lastFocus?.focus()}
$('closeSheet').onclick=closeSheet;$('backdrop').onclick=e=>{if(e.target===$('backdrop'))closeSheet()};document.addEventListener('keydown',e=>{if($('backdrop').hidden)return;if(e.key==='Escape')closeSheet();if(e.key==='Tab'){const f=[...$('backdrop').querySelectorAll('button:not(:disabled),input,select,a[href]')];if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===f.at(-1)){e.preventDefault();f[0].focus()}}});
function reset(){query='';group='全部';status='all';$('search').value='';render()}
$('search').oninput=e=>{query=e.target.value;render()};$('clearSearch').onclick=()=>{query='';$('search').value='';render();$('search').focus()};$('refresh').onclick=()=>{render();toast('列表已刷新')};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{status=b.dataset.filter;render()});
function view(on){compact=on;$('cardView').classList.toggle('on',!on);$('listView').classList.toggle('on',on);$('cardView').setAttribute('aria-pressed',!on);$('listView').setAttribute('aria-pressed',on);render()};$('cardView').onclick=()=>view(false);$('listView').onclick=()=>view(true);$('batch').onclick=()=>{batch=!batch;if(!batch)selected.clear();render()};
$('filter').onclick=()=>{openSheet('筛选机器人',`<label for="statusFilter">机器人状态</label><select id="statusFilter"><option value="all">全部状态</option><option value="online">在线（含故障机器人）</option><option value="fault">故障</option><option value="offline">离线</option></select><button class="primary" id="applyFilter">查看机器人</button>`);$('statusFilter').value=status;$('applyFilter').onclick=()=>{status=$('statusFilter').value;closeSheet();render()}};
function createGroup(){openSheet('新建机器人分组','<label for="groupName">分组名称</label><input id="groupName" maxlength="16" placeholder="例如：一楼展厅"><button class="primary" id="saveGroup">创建分组</button>');$('saveGroup').onclick=()=>{const name=$('groupName').value.trim();if(!name)return toast('请输入分组名称');if(name==='全部'||groups.includes(name))return toast('该分组名称已存在');groups.push(name);closeSheet();render();toast('已创建分组「'+name+'」')};$('groupName').focus()}
$('moveGroup').onclick=()=>{openSheet('移入分组',`<p>将 ${selected.size} 台机器人移入所选分组。</p><label for="targetGroup">目标分组</label><select id="targetGroup">${groups.map(g=>`<option>${esc(g)}</option>`).join('')}</select><button class="primary" id="applyGroup">确认移动</button>`);$('applyGroup').onclick=()=>{const target=$('targetGroup').value;devices.forEach(d=>{if(selected.has(d.id))d.group=target});closeSheet();batch=false;selected.clear();group=target;render();toast('机器人已移入「'+target+'」')}};render();
</script></body></html>
