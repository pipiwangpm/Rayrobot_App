<!DOCTYPE html>
<html class="w-full h-full overflow-hidden" lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width,initial-scale=1.0" name="viewport" />
    <title>通知设置 · RoboOps V2</title>
    <script src="https://modao.cc/agent-py/static/source/js/tailwindcss.js"></script>
    <script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.js"></script>
    <script src="mode.js"></script>
</head>

<body class="w-full h-full m-0 overflow-hidden flex items-center justify-center bg-slate-950 text-slate-100">
    <main class="w-full h-full max-w-[393px] max-h-[852px] overflow-hidden flex flex-col bg-slate-950 relative">
        <header class="px-5 pt-7 pb-3">
            <div class="flex items-center gap-3">
                <a href="profile.html" class="text-slate-400"><iconify-icon icon="solar:arrow-left-linear"
                        width="22"></iconify-icon></a>
                <h1 class="text-xl font-bold">通知设置</h1>
            </div>
            <p class="mt-1 text-[11px] text-slate-500">选择要接收的消息类型与时段 · 紧急告警为 P0 默认开启</p>
        </header>

        <section
            class="flex-1 min-h-0 overflow-y-auto overflow-x-hidden [scrollbar-width:none] [&::-webkit-scrollbar]:hidden px-5 pb-6 space-y-4">
            <!-- 总开关 -->
            <div class="rounded-2xl bg-slate-900 p-4 flex items-center gap-3">
                <span
                    class="w-10 h-10 rounded-xl bg-cyan-500/15 text-cyan-300 flex items-center justify-center"><iconify-icon
                        icon="solar:bell-bing-linear" width="20"></iconify-icon></span>
                <div class="flex-1">
                    <p class="text-sm font-semibold">应用内通知</p>
                    <p class="text-[11px] text-slate-500 mt-0.5">关闭后仅保留 P0 紧急告警</p>
                </div>
                <button onclick="tg(this)" data-on="1"
                    class="w-11 h-6 rounded-full relative transition bg-emerald-400"><i
                        class="absolute top-0.5 left-[22px] w-5 h-5 bg-white rounded-full transition-all"></i></button>
            </div>

            <!-- 消息类型 -->
            <div class="rounded-2xl bg-slate-900 overflow-hidden divide-y divide-slate-800">
                <div class="px-4 py-3.5 flex items-center gap-3">
                    <span
                        class="w-8 h-8 rounded-lg bg-rose-500/15 text-rose-300 flex items-center justify-center"><iconify-icon
                            icon="solar:shield-warning-linear" width="17"></iconify-icon></span>
                    <div class="flex-1">
                        <p class="text-sm">设备紧急告警 <span
                                class="ml-1 text-[9px] px-1.5 py-0.5 rounded bg-rose-500/15 text-rose-300">P0</span></p>
                        <p class="text-[10px] text-slate-500">离线 / 故障 / 任务失败 / 低电量</p>
                    </div>
                    <span class="text-[10px] text-slate-500">默认开启</span>
                </div>
                <div class="px-4 py-3.5 flex items-center gap-3">
                    <span
                        class="w-8 h-8 rounded-lg bg-violet-500/15 text-violet-300 flex items-center justify-center"><iconify-icon
                            icon="solar:checklist-linear" width="17"></iconify-icon></span>
                    <div class="flex-1">
                        <p class="text-sm">任务状态</p>
                        <p class="text-[10px] text-slate-500">任务待执行 / 完成 / 失败提醒</p>
                    </div>
                    <button onclick="tg(this)" data-on="1"
                        class="w-11 h-6 rounded-full relative transition bg-emerald-400"><i
                            class="absolute top-0.5 left-[22px] w-5 h-5 bg-white rounded-full transition-all"></i></button>
                </div>
                <div class="px-4 py-3.5 flex items-center gap-3">
                    <span
                        class="w-8 h-8 rounded-lg bg-amber-500/15 text-amber-300 flex items-center justify-center"><iconify-icon
                            icon="solar:refresh-circle-linear" width="17"></iconify-icon></span>
                    <div class="flex-1">
                        <p class="text-sm">OTA 升级提醒</p>
                        <p class="text-[10px] text-slate-500">新版本可用 / 升级完成</p>
                    </div>
                    <button onclick="tg(this)" data-on="1"
                        class="w-11 h-6 rounded-full relative transition bg-emerald-400"><i
                            class="absolute top-0.5 left-[22px] w-5 h-5 bg-white rounded-full transition-all"></i></button>
                </div>
                <!-- 会话与互动：仅云模式（依赖智能体/大模型） -->
                <div data-c class="px-4 py-3.5 flex items-center gap-3">
                    <span
                        class="w-8 h-8 rounded-lg bg-emerald-500/15 text-emerald-300 flex items-center justify-center"><iconify-icon
                            icon="solar:chat-round-call-linear" width="17"></iconify-icon></span>
                    <div class="flex-1">
                        <p class="text-sm">会话与互动</p>
                        <p class="text-[10px] text-slate-500">设备智能体主动发起 / 需你确认的互动</p>
                    </div>
                    <button onclick="tg(this)" data-on="0"
                        class="w-11 h-6 rounded-full relative transition bg-slate-700"><i
                            class="absolute top-0.5 left-0.5 w-5 h-5 bg-white rounded-full transition-all"></i></button>
                </div>
                <p data-l class="px-4 py-3 text-[10px] text-amber-300/80">本地模式：智能体会话/互动通知不可用（仅云能力）</p>
            </div>

            <!-- 免打扰 -->
            <div class="rounded-2xl bg-slate-900 p-4">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm font-semibold">免打扰时段</p>
                        <p class="text-[10px] text-slate-500 mt-0.5">P0 紧急告警不受影响</p>
                    </div>
                    <button onclick="tg(this)" data-on="0"
                        class="w-11 h-6 rounded-full relative transition bg-slate-700"><i
                            class="absolute top-0.5 left-0.5 w-5 h-5 bg-white rounded-full transition-all"></i></button>
                </div>
                <div class="mt-3 flex gap-2">
                    <button onclick="toast('开始时间：选择器待接入（演示 22:00）')"
                        class="flex-1 rounded-xl bg-slate-800 px-3 py-2.5 text-xs text-slate-200">开始 22:00</button>
                    <button onclick="toast('结束时间：选择器待接入（演示 08:00）')"
                        class="flex-1 rounded-xl bg-slate-800 px-3 py-2.5 text-xs text-slate-200">结束 08:00</button>
                </div>
            </div>

            <p class="pt-1 text-[11px] text-slate-600 leading-5">提醒：首次开启推送会请求系统通知授权（APNs/FCM 由平台配置）；设备告警 P0 不可单独关闭。</p>
        </section>

        <div id="toast"
            class="hidden absolute bottom-24 left-5 right-5 bg-slate-700 rounded-xl p-3 text-center text-xs">
        </div>
    </main>
    <script>
        function toast(t) { let x = document.getElementById('toast'); x.textContent = t; x.classList.remove('hidden'); setTimeout(() => x.classList.add('hidden'), 2200) }
        function tg(b) {
            const on = b.dataset.on !== '1';
            b.dataset.on = on ? '1' : '0';
            b.classList.toggle('bg-emerald-400', on);
            b.classList.toggle('bg-slate-700', !on);
            b.querySelector('i').className = 'absolute top-0.5 w-5 h-5 bg-white rounded-full transition-all' + (on ? ' left-[22px]' : ' left-0.5');
            toast(on ? '已开启该类通知' : '已关闭该类通知')
        }
    </script>
</body>

</html>
