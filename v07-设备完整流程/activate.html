<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>添加设备 · 镋钯</title><link rel="stylesheet" href="assets/device-flow.css"></head><body><script src="assets/device-flow.js"></script><script>
const {icon,esc,shell,toast,$}=Fleet;
let step=1,method='scan';
function render(){const steps=`<div class="stepper" aria-label="步骤 ${step} / 3">${[1,2,3].map(i=>`<i class="${i<=step?'done':''}"></i>`).join('')}</div>`;
let body='';
if(step===1)body=`<div class="page-intro"><div class="overline">ADD ROBOT / 01</div><h1>添加设备</h1><p>选择接入方式，完成设备发现与绑定。</p></div><div class="notice info">${icon('wifi')}<div>这是接入流程原型。扫码和蓝牙以可点击演示状态呈现，未调用手机硬件。</div></div><div class="flow-section"><div class="section-head"><h2>接入方式</h2><span>选择一种</span></div>${[['scan','扫描机身二维码','通过设备二维码识别 SN','camera'],['bluetooth','蓝牙发现','查找附近待接入设备','wifi'],['manual','手动输入 SN','适用于扫码不可用的场景','robot']].map(([key,name,desc,ico])=>`<button class="choice-card ${method===key?'selected':''}" data-method="${key}">${icon(ico)}<span><strong>${name}</strong><small>${desc}</small></span></button>`).join('')}</div><button class="button primary block" id="next">继续</button>`;
if(step===2)body=`<div class="page-intro"><div class="overline">ADD ROBOT / 02</div><h1>${method==='manual'?'输入设备信息':method==='bluetooth'?'附近设备':'扫描设备'}</h1><p>${method==='manual'?'输入设备序列号以继续接入。':'请选择一台待接入设备，继续配置。'}</p></div>${method==='manual'?`<label class="form-field"><span>设备 SN</span><input class="form-input" id="sn" placeholder="例如 TP-N08-202610" value="TP-N08-202610"></label>`:`<div class="video-stage" style="aspect-ratio:1.6;margin-bottom:18px"><div class="video-center">${icon(method==='scan'?'camera':'wifi',36)}<strong>${method==='scan'?'扫码区域预览':'正在查找附近设备'}</strong><span>原型演示 · 已找到 1 台待接入设备</span></div></div><button class="choice-card selected" id="found"><img class="mini-robot" src="assets/robot-golden-yellow.webp" alt="金黄色设备"><span><strong>待接入机器人 · N08</strong><small>SN TP-N08-202610 · 待接入</small></span></button>`}<div class="button-row"><button class="button secondary" id="prev">上一步</button><button class="button primary" id="next">继续</button></div>`;
if(step===3)body=`<div class="page-intro"><div class="overline">ADD ROBOT / 03</div><h1>确认设备信息</h1><p>检查信息后完成演示接入。</p></div><div class="panel" style="padding:17px"><div class="device-row"><img class="mini-robot" src="assets/robot-golden-yellow.webp" alt="金黄色设备"><div><strong>待接入机器人 · N08</strong><small>tangpa · 待配置</small></div></div></div><div class="flow-section"><label class="form-field"><span>设备名称</span><input class="form-input" id="name" value="待接入机器人 · N08" maxlength="24"></label><label class="form-field"><span>所在分组</span><select class="form-input" id="group"><option>未分组</option><option>大厅 A 区</option><option>巡更组</option><option>研发测试</option></select></label><label class="form-field"><span>设备 SN</span><input class="form-input" id="confirmSn" value="${esc(window.demoSn||'TP-N08-202610')}" readonly></label></div><div class="button-row"><button class="button secondary" id="prev">上一步</button><button class="button primary" id="finish">完成接入</button></div>`;
shell('添加设备',steps+body);
if(step===1){document.querySelectorAll('[data-method]').forEach(b=>b.onclick=()=>{method=b.dataset.method;render()});$('next').onclick=()=>{step=2;render()}}
if(step===2){$('prev').onclick=()=>{step=1;render()};$('next').onclick=()=>{if(method==='manual'){const value=$('sn').value.trim();if(!value){toast('请输入设备 SN');return}window.demoSn=value}step=3;render()}}
if(step===3){$('prev').onclick=()=>{step=2;render()};$('finish').onclick=()=>{if(!$('name').value.trim()){toast('请输入设备名称');return}const name=$('name').value.trim(),group=$('group').value;sessionStorage.setItem('fleet-activation-demo',JSON.stringify({name,group,sn:$('confirmSn').value}));renderSuccess(name,group)}}}
function renderSuccess(name,group){shell('接入完成',`<div class="activation-success"><div class="empty-mark">${icon('check',34)}</div><div class="overline">DEMO COMPLETE</div><h2>设备接入流程已完成</h2><p>${esc(name)} · ${esc(group)}</p><div class="notice info" style="text-align:left">${icon('alert')}<div>这是流程演示，未向平台写入新设备，也未建立实机连接。</div></div><div class="button-row"><a class="button secondary" href="activate.html">继续添加</a><a class="button primary" href="home.html">返回设备列表</a></div></div>`)}
render();
</script></body></html>
