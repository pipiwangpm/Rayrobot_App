<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>局域网连接 · 镋钯</title><link rel="stylesheet" href="assets/device-flow.css"></head><body><script src="assets/device-flow.js"></script><script>
const {device:d,href,icon,esc,shell,section,row,toast,$}=Fleet;
const scoped=new URLSearchParams(location.search).has('id');
const body=`<div class="page-intro"><div class="overline">LAN DIRECT${scoped?' / '+esc(d.id):''}</div><h1>局域网直连</h1><p>同网段发现设备，建立近场操作连接。</p></div><div class="notice info">${icon('wifi')}<div>当前为交互原型，不扫描实际局域网或建立设备连接。</div></div>${section('连接前检查',`<div class="panel">${scoped?row('目标设备',d.name)+row('设备 SN',d.sn)+row('已知 IP',d.ip):row('目标设备','未选择')}${row('手机网络','原型无法读取')}</div>`)}${section('查找设备',`<button class="button secondary block" id="scan">${icon('search')}模拟查找设备</button><div id="result" hidden></div>`)}<div class="button-row"><a class="button secondary" href="${scoped?href('server-connection'):'server-connection.html'}">返回连接方式</a><a class="button primary" href="${scoped?href('device'):'home.html'}">${scoped?'查看设备详情':'选择设备'}</a></div>`;
shell('局域网连接',body,'',scoped?href('server-connection'):'server-connection.html');
$('scan').onclick=()=>{const found=scoped&&d.state!=='offline';$('result').hidden=false;$('result').innerHTML=found?`<div class="notice info">${icon('check')}<div>演示发现：${esc(d.name)} · ${esc(d.ip)}。实际网络是否可达，需要接入设备接口后确认。</div></div>`:`<div class="notice">${icon('alert')}<div>${scoped?esc(d.name)+' 当前记录为离线':'请先从设备列表选择设备'}，原型无法验证局域网状态。</div></div>`;toast('已完成模拟查找')};
</script></body></html>
