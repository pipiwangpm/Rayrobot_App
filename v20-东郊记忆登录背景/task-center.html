<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>任务中心 · 镋钯机器人</title><link rel="stylesheet" href="assets/full-app.css"><link rel="stylesheet" href="assets/phone-frame-v18.css"></head><body><script src="assets/device-flow.js"></script><script src="assets/full-app.js"></script><script>
const {$,page,toast,confirm,get,set,esc,icon}=AppUI;
const local=(()=>{try{return new URLSearchParams(location.search).get('m')==='local'||localStorage.getItem('robops.mode')==='local'}catch(e){return false}})();
const initial=[{id:'t1',name:'大厅迎宾 · 秋日主题',type:'脚本',robots:['A03'],note:'迎宾导览 · 角色「迎宾大使」',status:'执行中',runs:[['今天 10:02','执行中','A03','正在执行'],['今天 07:30','成功','A03','耗时 12 分钟']]},{id:'t2',name:'展厅接待',type:'脚本',robots:['K12'],note:'展厅接待 · 角色「接待员」',status:'执行中',runs:[['今天 10:08','执行中','K12','正在执行']]},{id:'t3',name:'早间迎宾',type:'脚本',robots:['A03'],note:'迎宾导览',status:'成功',runs:[['今天 07:30','成功','A03','耗时 8 分钟'],['今天 06:58','失败','A03','机器人被其他任务占用']]},{id:'t4',name:'访客咨询',type:'脚本',robots:['K12'],note:'展厅接待',status:'失败',runs:[['今天 08:12','失败','K12','连接中断，拒绝下发']]},{id:'t5',name:'品牌快闪 · 广告轮播',type:'广告',robots:['A03','U2'],note:'两支素材按序循环',status:'成功',runs:[['昨天 13:00','成功','A03、U2','耗时 30 分钟']]},{id:'t6',name:'贵宾厅跟随',type:'跟随',robots:['U2'],note:'固定引导员 · 贴身跟随',status:'成功',runs:[['昨天 15:30','成功','U2','耗时 20 分钟']]},{id:'t7',name:'闭馆温馨提醒',type:'口播',robots:['A03'],note:'默认音色 · 42 字',status:'成功',runs:[['今天 09:40','成功','A03','耗时 38 秒']]}];
let added=get('tasks',[]),filter='全部';const all=()=>[...added,...initial];
const body=`<div class="tabs" id="tabs"></div><div id="taskList"></div>${local?`<div class="section-panel"><h2>本地素材</h2><p>夏季新品轮播 · 已缓存至 A03、U2</p><p>开业酬宾 · 已缓存至 A03</p></div>`:''}<details class="section-panel"><summary style="cursor:pointer;font-weight:700">任务下发规则</summary><p>任务下发后立即判定。机器人占用或离线时会拒绝本次执行并记录原因，不进入等待队列。</p></details>`;
page('任务中心',body,{primary:true,active:'任务',right:`<a class="icon-button" href="task-create.html${local?'?m=local':''}" aria-label="新建任务">${icon('plus')}</a>`});
function badge(s){return s==='失败'?'warn':s==='执行中'?'blue':s==='成功'?'':'neutral'}
function render(){const rows=local?all().filter(t=>t.robots.includes('A03')||t.robots.includes('K12')):all();$('tabs').innerHTML=['全部','执行中','成功','失败'].map(x=>`<button class="tab ${filter===x?'active':''}" data-filter="${x}">${x}</button>`).join('');const shown=rows.filter(t=>filter==='全部'||t.status===filter);$('taskList').innerHTML=shown.length?shown.map(t=>`<article class="list-card"><div class="card-head"><div><h2>${esc(t.name)}</h2><p>${esc(t.note)}</p></div><span class="status-chip ${badge(t.status)}">${esc(t.status)}</span></div><div class="card-meta"><span>${esc(t.type)}任务</span><span>${t.robots.map(esc).join('、')}</span></div><details class="task-history"><summary>查看执行记录 · ${t.runs.length} 条</summary><div class="timeline">${t.runs.map(r=>`<div class="timeline-item"><small>${esc(r[0])} · ${esc(r[2])}</small><strong>${esc(r[1])}</strong><p>${esc(r[3])}</p></div>`).join('')}</div></details><div class="card-actions"><button class="button secondary" data-retry="${esc(t.id)}" ${t.status==='执行中'?'disabled':''}>再次执行</button><a class="button secondary" href="task-create.html?copy=${encodeURIComponent(t.id)}">复制任务</a></div></article>`).join(''):'<div class="list-empty">当前筛选下没有任务。</div>';document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.querySelectorAll('[data-retry]').forEach(b=>b.onclick=()=>{const t=all().find(x=>x.id===b.dataset.retry);confirm('再次执行“'+t.name+'”？','请确认目标机器人处于可用状态。',()=>toast('操作已确认'))})}
render();
</script></body></html>
