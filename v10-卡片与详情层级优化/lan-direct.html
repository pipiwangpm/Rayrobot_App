<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>局域网连接 · 镋钯</title><link rel="stylesheet" href="assets/device-flow.css"></head><body><script src="assets/device-flow.js"></script><script>
const {device:d,href,icon,esc,shell,section,row,toast,$}=Fleet;
const scoped=new URLSearchParams(location.search).has('id');
const body=`<div class="page-intro"><h1>局域网直连</h1><p>同网段发现机器人，建立近场操作连接。</p></div><div class="notice info">${icon('wifi')}<div>局域网扫描未连接。</div></div>${section('连接前检查',`<div class="panel">${scoped?row('目标机器人',d.name)+row('机器人 SN',d.sn)+row('已知 IP',d.ip):row('目标机器人','未选择')}${row('手机网络','未知')}</div>`)}${section('查找机器人',`<button class="button secondary block" id="scan">${icon('search')}模拟查找机器人</button><div id="result" hidden></div>`)}<div class="button-row"><a class="button secondary" href="${scoped?href('server-connection'):'server-connection.html'}">返回连接方式</a><a class="button primary" href="${scoped?href('device'):'home.html'}">${scoped?'查看机器人详情':'选择机器人'}</a></div>`;
shell('局域网连接',body,'',scoped?href('server-connection'):'server-connection.html');
$('scan').onclick=()=>{const found=scoped&&d.state!=='offline';$('result').hidden=false;$('result').innerHTML=found?`<div class="notice info">${icon('check')}<div>演示发现：${esc(d.name)} · ${esc(d.ip)}。实际网络是否可达，需要接入机器人接口后确认。</div></div>`:`<div class="notice">${icon('alert')}<div>${scoped?esc(d.name)+' 当前记录为离线':'请先从机器人列表选择机器人'}，局域网状态未验证。</div></div>`;toast('已完成模拟查找')};
</script></body></html>
