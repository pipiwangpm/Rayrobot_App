<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>创建租户 · 镋钯机器人</title><link rel="stylesheet" href="assets/full-app.css"></head><body><script src="assets/device-flow.js"></script><div class="auth-wrap"><a class="icon-button" href="auth.html" aria-label="返回登录" id="back"></a><p class="auth-kicker">新租户接入</p><h1>创建租户</h1><p class="subtle">填写组织与管理员信息，预览开通流程。</p><form id="registerForm" class="form-grid"><label><span class="field-title">租户名称</span><input class="form-input" id="tenant" required placeholder="请输入组织名称"></label><label><span class="field-title">联系人 / 用户名</span><input class="form-input" id="contact" required placeholder="例如：张明"></label><label><span class="field-title">手机号</span><input class="form-input" id="phone" required inputmode="tel" maxlength="11" placeholder="请输入 11 位手机号"></label><label><span class="field-title">设置密码</span><input class="form-input" id="password" required type="password" minlength="8" placeholder="至少 8 位"></label><label><span class="field-title">确认密码</span><input class="form-input" id="confirmPassword" required type="password" placeholder="再次输入密码"></label><label class="tiny" style="display:flex;gap:9px;align-items:flex-start;margin:6px 0"><input type="checkbox" id="agree" style="accent-color:#ff6937;margin-top:3px"><span>我已阅读并同意《用户协议》与《隐私政策》</span></label><button class="button primary block" type="submit">提交并创建租户</button></form><div id="authToast" class="flow-toast" role="status" hidden></div></div><script>
const $=id=>document.getElementById(id);$('back').innerHTML=Fleet.icon('back');let timer;function message(text){$('authToast').textContent=text;$('authToast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('authToast').hidden=true,3000)}
$('registerForm').onsubmit=e=>{e.preventDefault();if(!/^1\d{10}$/.test($('phone').value.trim()))return message('请填写正确的手机号');if($('password').value!==$('confirmPassword').value)return message('两次输入的密码不一致');if(!$('agree').checked)return message('请先同意用户协议和隐私政策');document.querySelector('.auth-wrap').innerHTML=`<div class="activation-success"><div class="empty-mark">${Fleet.icon('check',34)}</div><h1>流程已完成</h1><p>“${Fleet.esc($('tenant').value.trim())}”尚未开通。</p><a class="button primary block" href="auth.html">返回登录</a></div>`};
</script></body></html>
