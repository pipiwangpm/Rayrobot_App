<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>遥操 · 镋钯</title><link rel="stylesheet" href="assets/device-flow.css"><style>.remote-stage{min-height:220px;border:1px solid #3a4850;border-radius:17px;background:radial-gradient(circle at 50% 45%,#2a383e,#11191d 70%);position:relative;display:grid;place-items:center;overflow:hidden}.remote-stage:before,.remote-stage:after{content:"";position:absolute;border:1px solid #ffffff14;border-radius:50%;width:210px;height:210px}.remote-stage:after{width:120px;height:120px}.remote-stage img{height:170px;width:160px;object-fit:contain;position:relative;z-index:1;opacity:.8}.remote-state{display:flex;align-items:center;justify-content:space-between;margin-top:13px;color:#a8b7be}.remote-state strong{color:#ffb27c}.pad{margin:25px auto;width:214px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pad button{height:62px;background:#28343a;border:1px solid #475963;border-radius:14px;color:#f2f5f6;font-size:22px}.pad button:active,.pad button.pressed{background:#ff6937;color:#171b1e}.pad .blank{visibility:hidden}.pad .halt{background:#3a292b;color:#ff9ea2;font-size:13px;font-weight:700}.speed-line{display:flex;align-items:center;gap:12px;margin-top:15px}.speed-line input{flex:1;accent-color:#ff6937}.speed-line output{width:34px;text-align:right}</style></head><body><script src="assets/device-flow.js"></script><script>
const {device:d,href,icon,esc,shell,$}=Fleet;
const content=`<div class="page-intro"><h1>遥操</h1><p>${esc(d.name)}</p></div><div class="remote-stage"><img src="assets/${esc(d.image)}" alt="机器人外观"></div><div class="remote-state"><span>控制连接</span><strong>待建立</strong></div><section class="flow-section"><div class="section-head"><h2>移动方向</h2></div><div class="pad" aria-label="方向控制"><span class="blank"></span><button aria-label="向前" data-direction="前进">↑</button><span class="blank"></span><button aria-label="向左" data-direction="左转">←</button><button class="halt" data-direction="停止">停止</button><button aria-label="向右" data-direction="右转">→</button><span class="blank"></span><button aria-label="向后" data-direction="后退">↓</button><span class="blank"></span></div><label class="speed-line"><span>速度</span><input type="range" min="1" max="5" value="2" id="speed"><output id="speedValue">2</output></label></section>`;
shell('遥操',content,`<a class="icon-button" href="${href('device')}" aria-label="机器人详情">${icon('robot')}</a>`,href('device'));
$('speed').oninput=()=>{$('speedValue').textContent=$('speed').value};document.querySelectorAll('[data-direction]').forEach(b=>{b.onpointerdown=()=>b.classList.add('pressed');b.onpointerup=b.onpointercancel=()=>b.classList.remove('pressed');b.onclick=()=>Fleet.toast('控制连接未建立')});
</script></body></html>
