<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>机器人设置 · 镋钯</title><link rel="stylesheet" href="assets/device-flow.css"></head><body><script src="assets/device-flow.js"></script><script>
const {device:d,href,icon,esc,shell,section,toast,save,$}=Fleet;
let settings={};try{settings=JSON.parse(localStorage.getItem('fleet-settings-'+d.id)||'{}')}catch(e){}
settings={exposure:'3',gamma:1.25,brightness:0,rotation:12,frequency:'0',speakerConnected:false,volume:60,mic:true,gain:70,...settings};
const slider=(id,label,min,max,step,value,suffix='',hint='')=>`<div class="slider-field"><div class="slider-head"><span>${label}</span><output id="${id}Value">${value}${suffix}</output></div><input id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${value}">${hint?`<small>${hint}</small>`:''}</div>`;
const identity=section('机器人档案',`<label class="form-field"><span>机器人名称</span><input class="form-input" id="deviceName" maxlength="24" value="${esc(d.name)}"></label><label class="form-field"><span>所在分组</span><select class="form-input" id="deviceGroup"><option>大厅 A 区</option><option>巡更组</option><option>研发测试</option><option>未分组</option></select></label><p class="subtle">序列号 ${esc(d.sn)} · ${esc(d.model)}</p>`);
const camera=section('相机参数',`<div class="panel"><label class="setting-line"><span>曝光模式</span><select class="form-input" id="exposure"><option value="0">0 · 默认</option><option value="1">1 · 手动</option><option value="3">3 · 自动</option></select></label>${slider('gamma','伽马值',0.5,2,.05,settings.gamma,'','范围 0.5 ~ 2.0')}${slider('brightness','亮度',-64,64,1,settings.brightness,'','范围 -64 ~ +64')}${slider('rotation','转动角度（安装校准）',-360,360,1,settings.rotation,'°','每台机器安装位置不同，请单独校准。')}<button class="text-action" id="resetCamera">恢复相机默认值</button></div>`);
const power=section('电源',`<div class="panel"><label class="setting-line"><span>电源频率</span><select class="form-input" id="frequency"><option value="0">0 · 自动</option><option value="1">1 · 50Hz</option><option value="2">2 · 60Hz</option></select></label><p class="setting-note">出现荧光灯频闪或画面波纹时，可按现场电网调整。</p></div>`);
const audio=section('外设与音频',`<div class="panel"><div class="toggle-row"><span><strong>外接蓝牙音响</strong><small id="speakerStatus">未连接</small></span><button class="button secondary" id="speakerConnect" style="min-height:34px;padding:0 12px">连接</button></div>${slider('volume','音响音量',0,100,1,settings.volume,'%')}<label class="toggle-row"><span><strong>麦克风</strong><small>内置麦克风</small></span><input class="switch" id="mic" type="checkbox"></label>${slider('gain','麦克风增益',0,100,1,settings.gain,'%')}</div>`);
const footer=`<button class="button primary block" id="save" style="margin-top:28px">保存机器人设置</button>`;
shell('机器人设置',`<div class="page-intro"><h1>机器人设置</h1><p>${esc(d.name)}</p></div><div class="notice info">${icon('settings')}<div>机型参数请以实际机器人为准。</div></div>`+identity+camera+power+audio+footer,`<a class="icon-button" href="${href('device')}" aria-label="机器人详情">${icon('robot')}</a>`,href('device'));
$('deviceGroup').value=d.group;$('exposure').value=settings.exposure;$('frequency').value=settings.frequency;$('mic').checked=settings.mic;
for(const [key,suffix] of [['gamma',''],['brightness',''],['rotation','°'],['volume','%'],['gain','%']])$(key).oninput=()=>$(key+'Value').value=$(key).value+suffix;
function showSpeaker(){$('speakerStatus').textContent=settings.speakerConnected?'演示已连接':'未连接';$('speakerConnect').textContent=settings.speakerConnected?'断开':'连接'}showSpeaker();
$('speakerConnect').onclick=()=>{settings.speakerConnected=!settings.speakerConnected;showSpeaker();toast(settings.speakerConnected?'演示蓝牙音响已连接':'演示蓝牙音响已断开')};
$('resetCamera').onclick=()=>{for(const [key,value] of Object.entries({exposure:'3',gamma:1.25,brightness:0,rotation:12})){$(key).value=value;if($(key+'Value'))$(key+'Value').value=value+(key==='rotation'?'°':'')}toast('相机参数已恢复默认值，记得保存')};
$('save').onclick=()=>{const name=$('deviceName').value.trim();if(!name){toast('请填写机器人名称');$('deviceName').focus();return}const next={exposure:$('exposure').value,gamma:Number($('gamma').value),brightness:Number($('brightness').value),rotation:Number($('rotation').value),frequency:$('frequency').value,speakerConnected:settings.speakerConnected,volume:Number($('volume').value),mic:$('mic').checked,gain:Number($('gain').value)};localStorage.setItem('fleet-settings-'+d.id,JSON.stringify(next));save({name,group:$('deviceGroup').value});toast('机器人设置已保存')};
</script></body></html>
