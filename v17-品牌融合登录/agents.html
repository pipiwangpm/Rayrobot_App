<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>智能体 · 镋钯机器人</title><link rel="stylesheet" href="assets/device-flow.css"><link rel="stylesheet" href="assets/full-app.css"><link rel="stylesheet" href="assets/agent-v10.css"></head><body><script src="assets/device-flow.js"></script><script src="assets/full-app.js"></script><script src="assets/agent-store.js"></script><script>
const {icon,esc}=Fleet;const list=AgentStore.all();
const content=`<p class="agent-count">我的智能体 · ${list.length} 个</p><div class="agent-list">${list.map(a=>`<a class="roster-card ${a.ready?'':'pending'}" href="agent-detail.html?id=${encodeURIComponent(a.id)}" aria-label="查看${esc(a.name)}详情"><div class="agent-top"><div class="agent-portrait">${esc(a.glyph||a.name?.charAt(0)||'智')}</div><div class="agent-name"><strong>${esc(a.name)}</strong><span>${esc(a.role||'未命名场景')}</span></div><div class="agent-ready">${a.ready?'● 配置完整':'● 待配置'}</div></div><p>${esc(a.desc||'尚未添加人设')}</p><div class="agent-facts"><span>知识库 <b>${Array.isArray(a.docs)?a.docs.length:0}</b></span><span>声音 <b>${esc(a.voice||'未设置')}</b></span><span class="agent-open">›</span></div></a>`).join('')}</div>`;
AppUI.page('智能体',content,{primary:true,active:'智能体',right:`<a class="agent-add" href="agent-builder.html" aria-label="新建智能体">${icon('plus')}</a>`});
</script></body></html>
