<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的 · 镋钯机器人</title><link rel="stylesheet" href="assets/device-flow.css"><link rel="stylesheet" href="assets/full-app.css"><link rel="stylesheet" href="assets/profile-v10.css"></head><body><script src="assets/device-flow.js"></script><script src="assets/full-app.js"></script><script src="assets/agent-store.js"></script><script>
const {icon,esc,$}=Fleet;const defaults={name:'赵楷',role:'现场运营专员',org:'成都人形机器人创新中心'};let profile={...defaults};try{const saved=JSON.parse(localStorage.getItem('tangpa.prototype.profile')||'null');if(saved&&typeof saved==='object')for(const key of Object.keys(defaults))if(typeof saved[key]==='string'&&saved[key].trim())profile[key]=saved[key].trim()}catch(e){}
const requestedMode=new URLSearchParams(location.search).get('m');const mode=requestedMode==='local'||requestedMode==='cloud'?requestedMode:localStorage.getItem('robops.mode')==='local'?'local':'cloud';const modeText=mode==='local'?'本地 · 内网':'云端连接';
const content=`<section class="profile-console"><div class="profile-top"><div class="profile-avatar" id="profileAvatar"></div><div class="profile-person"><strong id="profileName"></strong><span id="profileRole"></span></div><button class="profile-edit" id="editProfile" aria-label="编辑个人资料">${icon('edit',17)}</button></div><img class="profile-robot" src="assets/robot-pearl-white.webp" alt="" aria-hidden="true"><div class="profile-org"><small>所属机构</small><strong id="profileOrg"></strong></div><div class="profile-console-foot"><b>机器人运营权限</b><span class="profile-connection"><i></i>${modeText}</span></div></section><section class="profile-section"><h2>连接与通知</h2><div class="profile-links"><a class="profile-link" href="server-connection.html">${icon('wifi')}<span>连接与部署</span><em>${modeText}</em><span class="arrow">›</span></a><a class="profile-link" href="lan-direct.html">${icon('link')}<span>局域网直连</span><span class="arrow">›</span></a><a class="profile-link" href="notification-settings.html">${icon('bell')}<span>通知设置</span><span class="arrow">›</span></a></div></section><section class="profile-section"><h2>系统</h2><div class="profile-links"><a class="profile-link" href="system-settings.html">${icon('settings')}<span>系统设置</span><span class="arrow">›</span></a><a class="profile-link" href="about.html">${icon('file')}<span>教程与关于</span><span class="arrow">›</span></a><button class="profile-link profile-exit" id="logout">${icon('power')}<span>退出当前账户</span><span class="arrow">›</span></button></div></section>`;
AppUI.page('我的',content,{primary:true,active:'我的'});
function render(){ $('profileAvatar').textContent=profile.name.charAt(0)||'赵';$('profileName').textContent=profile.name;$('profileRole').textContent=profile.role;$('profileOrg').textContent=profile.org }render();
$('editProfile').onclick=()=>{document.body.insertAdjacentHTML('beforeend',`<div class="profile-modal" id="profileModal"><form class="profile-modal-panel" id="profileForm"><h2>编辑个人资料</h2><label for="profileNameInput">姓名</label><input id="profileNameInput" maxlength="20" required><label for="profileRoleInput">岗位</label><input id="profileRoleInput" maxlength="30" required><label for="profileOrgInput">所属机构</label><input id="profileOrgInput" maxlength="50" required><div class="profile-modal-actions"><button type="button" id="cancelProfile">取消</button><button type="submit">保存资料</button></div></form></div>`);$('profileNameInput').value=profile.name;$('profileRoleInput').value=profile.role;$('profileOrgInput').value=profile.org;$('cancelProfile').onclick=()=>$('profileModal').remove();$('profileModal').onclick=e=>{if(e.target===$('profileModal'))$('profileModal').remove()};$('profileForm').onsubmit=e=>{e.preventDefault();profile={name:$('profileNameInput').value.trim(),role:$('profileRoleInput').value.trim(),org:$('profileOrgInput').value.trim()};if(Object.values(profile).some(x=>!x))return;localStorage.setItem('tangpa.prototype.profile',JSON.stringify(profile));render();$('profileModal').remove();Fleet.toast('资料已保存')};$('profileNameInput').focus()};
$('logout').onclick=()=>Fleet.confirmAction('退出当前账户？','将返回登录页面。',()=>location.href='auth.html');
if(mode==='local')document.querySelectorAll('a[href$=".html"]').forEach(a=>a.href+='?m=local');
</script></body></html>
