<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>新建任务 · 镋钯机器人</title><link rel="stylesheet" href="assets/full-app.css"></head><body><script src="assets/device-flow.js"></script><script src="assets/full-app.js"></script><script>
const {$,page,toast,get,set,esc,icon}=AppUI;const params=new URLSearchParams(location.search);const local=params.get('m')==='local'||(()=>{try{return localStorage.getItem('robops.mode')==='local'}catch(e){return false}})();
let step=1;const state={type:params.has('copy')?(params.get('copy')==='t5'?'广告':params.get('copy')==='t6'?'跟随':params.get('copy')==='t7'?'口播':'脚本'):'脚本',name:'',script:'迎宾导览',materials:[],loop:'单次',strategy:'固定引导员',distance:'1.5',voiceText:'',voice:'晓雅',repeat:'单次',robots:[]};
const typeInfo=[['脚本','选择脚本并为角色绑定机器人','file'],['广告','选择屏幕素材与播放方式','video'],['跟随','设置跟随对象与距离','pin'],['口播','输入文字并选择音色','volume']];
const stepper=()=>`<div class="stepper" aria-label="步骤 ${step} / 3">${[1,2,3].map(i=>`<i class="${i<=step?'done':''}"></i>`).join('')}</div>`;
function content(){if(step===1)return `${stepper()}<div class="page-intro"><h1>选择任务类型</h1><p>从四类任务中选择一类，继续配置。</p></div>${typeInfo.map(([key,desc,glyph])=>`<button class="choice-card ${state.type===key?'selected':''}" data-type="${key}">${icon(glyph)}<span><strong>${key}任务</strong><small>${desc}</small></span></button>`).join('')}<button class="button primary block" id="next">下一步</button>`;
if(step===2){let fields='';if(state.type==='脚本')fields=`<label class="form-field"><span>执行脚本</span><select class="form-input" id="script"><option>迎宾导览</option><option>夜间巡检</option><option>配送流程</option></select></label><div class="notice info">${icon('file')}<div>脚本包含虚拟角色。下一步选择执行机器人后，按角色进行绑定。</div></div>`;
if(state.type==='广告')fields=`<div class="field-title">广告素材</div>${['夏季新品轮播','开业酬宾','品牌形象片'].map(m=>`<label class="choice-line"><input type="checkbox" name="material" value="${m}" ${state.materials.includes(m)?'checked':''}><span><strong>${m}</strong><small>已上传素材 · 演示</small></span></label>`).join('')}<label class="form-field"><span>播放方式</span><select class="form-input" id="loop"><option>单次</option><option>循环 3 次</option><option>持续循环</option></select></label>`;
if(state.type==='跟随')fields=`<label class="form-field"><span>跟随对象</span><select class="form-input" id="strategy"><option>固定引导员</option><option>视觉目标</option></select></label><label class="form-field"><span>跟随距离</span><select class="form-input" id="distance"><option value="1.0">约 1 米</option><option value="1.5">约 1.5 米</option><option value="2.0">约 2 米</option></select></label>`;
if(state.type==='口播')fields=`<label class="form-field"><span>口播文字</span><textarea class="form-textarea" id="voiceText" maxlength="200" placeholder="请输入需要播报的内容">${esc(state.voiceText)}</textarea></label><label class="form-field"><span>音色</span><select class="form-input" id="voice"><option>晓雅</option><option>阿远</option><option>默认音色</option></select></label><label class="form-field"><span>播报次数</span><select class="form-input" id="repeat"><option>单次</option><option>循环 3 次</option><option>循环 5 次</option></select></label>`;
return `${stepper()}<div class="page-intro"><h1>配置${state.type}任务</h1><p>填写任务内容，再选择目标机器人。</p></div><label class="form-field"><span>任务名称</span><input class="form-input" id="taskName" maxlength="30" placeholder="例如：大厅迎宾 · 秋日主题" value="${esc(state.name)}"></label>${fields}<div class="button-row"><button class="button secondary" id="prev">上一步</button><button class="button primary" id="next">下一步</button></div>`}
return `${stepper()}<div class="page-intro"><h1>选择机器人</h1><p>选择要执行“${state.type}任务”的机器人。</p></div>${[['A03','迎宾机器人 · A03','在线'],['K12','巡检机器人 · K12','在线'],['U2','双轮足机器人 · U2','故障'],['D07','配送机器人 · D07','离线']].map(([id,name,status])=>`<label class="choice-line ${state.robots.includes(id)?'selected':''}"><input type="checkbox" name="target" value="${id}" ${state.robots.includes(id)?'checked':''} ${status==='离线'?'disabled':''}><span><strong>${name}</strong><small>${status==='离线'?'离线，暂不可选':status==='故障'?'故障，建议先核实':'可选择'}</small></span><span class="status-chip ${status==='在线'?'':'warn'}">${status}</span></label>`).join('')}<div class="notice info">${icon('alert')}<div>任务服务未连接。</div></div><div class="button-row"><button class="button secondary" id="prev">上一步</button><button class="button primary" id="submit">提交任务</button></div>`}
function render(){page('新建任务',(local?`<div class="notice info">${icon('alert')}<div>本地模式可用任务与缓存资源需按实机确认。当前仅演示填写流程。</div></div>`:'')+content(),{back:'task-center.html'+(local?'?m=local':'')});if(step===1){document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{state.type=b.dataset.type;render()});$('next').onclick=()=>{step=2;render()}}else if(step===2){$('prev').onclick=()=>{state.name=$('taskName').value.trim();step=1;render()};for(const key of ['script','loop','strategy','distance','voice','repeat'])if($(key))$(key).value=state[key];$('next').onclick=()=>{if(!saveConfig())return;step=3;render()}}else{$('prev').onclick=()=>{state.robots=[...document.querySelectorAll('input[name="target"]:checked')].map(x=>x.value);step=2;render()};$('submit').onclick=submit}}
function saveConfig(){state.name=$('taskName').value.trim();if(!state.name){toast('请填写任务名称');return false}if(state.type==='脚本')state.script=$('script').value;if(state.type==='广告'){state.materials=[...document.querySelectorAll('input[name="material"]:checked')].map(x=>x.value);state.loop=$('loop').value;if(!state.materials.length){toast('请至少选择一项广告素材');return false}}if(state.type==='跟随'){state.strategy=$('strategy').value;state.distance=$('distance').value}if(state.type==='口播'){state.voiceText=$('voiceText').value.trim();state.voice=$('voice').value;state.repeat=$('repeat').value;if(!state.voiceText){toast('请输入口播文字');return false}}return true}
function submit(){state.robots=[...document.querySelectorAll('input[name="target"]:checked')].map(x=>x.value);if(!state.robots.length){toast('请至少选择一台机器人');return}const all=get('tasks',[]);all.unshift({id:'demo-'+Date.now(),name:state.name,type:state.type,robots:state.robots,note:state.type==='脚本'?state.script:state.type==='广告'?state.materials.join('、'):state.type==='跟随'?state.strategy+' · '+state.distance+' 米':state.voice+' · '+state.voiceText.length+' 字',status:'演示提交',runs:[['刚刚','演示提交',state.robots.join('、'),'未向真实机器人下发']]});set('tasks',all);page('任务已提交',`<div class="activation-success"><div class="empty-mark">${icon('check',34)}</div><h2>任务流程已完成</h2><p>${esc(state.name)} · ${state.robots.map(esc).join('、')}</p><div class="notice info" style="text-align:left">${icon('alert')}<div>任务尚未下发。</div></div><a class="button primary block" href="task-center.html${local?'?m=local':''}">返回任务中心</a></div>`,{back:'task-center.html'+(local?'?m=local':'')})}
render();
</script></body></html>
