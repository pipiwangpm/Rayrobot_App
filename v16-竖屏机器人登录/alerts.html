<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>消息中心 · 镋钯机器人</title><link rel="stylesheet" href="assets/full-app.css"></head><body><script src="assets/device-flow.js"></script><script src="assets/full-app.js"></script><script>
const {$,page,toast,get,set,esc,icon}=AppUI;
const alerts=[{id:'offline-D07',name:'机器人离线超过 15 分钟',detail:'配送机器人 · D07',time:'今天 09:42',level:'warn',target:'D07'},{id:'battery-U2',name:'电量低于安全阈值',detail:'双轮足机器人 · U2 · 当前 21%',time:'今天 08:16',level:'warn',target:'U2'}];
const tasks=[{name:'大厅迎宾 · 秋日主题',detail:'迎宾机器人 A03 · 执行中',time:'今天 10:20',state:'执行中'},{name:'品牌快闪 · 广告轮播',detail:'下发成功 · 1 台机器人',time:'今天 09:18',state:'成功'},{name:'货架盘点',detail:'目标机器人被占用 · 下发失败',time:'昨天 17:44',state:'失败'}];
let tab='alerts',handled=get('handled-alerts',[]);
const body=`<p class="page-lead">机器人状态变化与任务执行结果集中在这里。</p><div class="stat-grid"><div><small>未处理告警</small><strong class="bad" id="alertCount">02</strong></div><div><small>任务消息</small><strong>03</strong></div><div><small>今天新增</small><strong>04</strong></div></div><div class="tabs" id="tabs"><button class="tab active" data-tab="alerts">告警</button><button class="tab" data-tab="tasks">任务</button></div><div id="items"></div>`;
page('消息中心',body,{primary:true,active:'消息'});
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('alertCount').textContent=String(alerts.filter(a=>!handled.includes(a.id)).length).padStart(2,'0');$('items').innerHTML=tab==='alerts'?alerts.map(a=>`<article class="list-card"><div class="card-head"><div><h2>${esc(a.name)}</h2><p>${esc(a.detail)}</p></div><span class="status-chip ${handled.includes(a.id)?'neutral':'warn'}">${handled.includes(a.id)?'已处理':'待处理'}</span></div><div class="card-meta"><span>${esc(a.time)}</span><span>机器人告警</span></div><div class="card-actions"><a class="button secondary" href="device.html?id=${a.target}">查看机器人</a><button class="button ${handled.includes(a.id)?'secondary':'primary'}" data-handle="${a.id}" ${handled.includes(a.id)?'disabled':''}>${handled.includes(a.id)?'已处理':'标记已处理'}</button></div></article>`).join(''):tasks.map(t=>`<article class="list-card"><div class="card-head"><div><h2>${esc(t.name)}</h2><p>${esc(t.detail)}</p></div><span class="status-chip ${t.state==='失败'?'warn':t.state==='成功'?'':'blue'}">${t.state}</span></div><div class="card-meta"><span>${esc(t.time)}</span><span>任务消息</span></div><div class="card-actions"><a class="button secondary" href="task-center.html">查看任务</a></div></article>`).join('');document.querySelectorAll('[data-handle]').forEach(b=>b.onclick=()=>{handled=[...new Set([...handled,b.dataset.handle])];set('handled-alerts',handled);render();toast('已标记为处理完成')})}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});render();
</script></body></html>
