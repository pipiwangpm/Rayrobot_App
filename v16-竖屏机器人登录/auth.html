<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1014">
  <title>登录 · 镋钯机器人</title>
  <link rel="stylesheet" href="assets/auth-v16.css">
</head>
<body>
<main class="login-shell">
  <section class="hero" aria-label="三台不同配色的机器人">
    <div class="hero-image" aria-hidden="true"></div>
    <div class="hero-grid" aria-hidden="true"></div>
    <div class="light-sweep" aria-hidden="true"></div>
    <header class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 28 28" fill="none"><rect x="4" y="8" width="20" height="15" rx="5" stroke="currentColor" stroke-width="2"/><path d="M14 4v4M10 15h.01M18 15h.01" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
      </span>
      <span class="brand-copy"><strong>镋钯机器人</strong><small>机器人运营平台</small></span>
    </header>
    <div class="hero-copy">
      <span class="hero-line"></span>
      <h1>让机器人<br>即刻就位</h1>
      <p>连接现场，开启协作。</p>
    </div>
    <div class="hero-edge" aria-hidden="true"></div>
  </section>

  <section class="form-panel" aria-labelledby="loginTitle">
    <div class="form-top">
      <div>
        <p class="section-kicker">欢迎回来</p>
        <h2 id="loginTitle">账号登录</h2>
      </div>
      <span class="account-badge">运维分配账号</span>
    </div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="account">账号</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>
          <input id="account" name="account" type="text" autocomplete="username" placeholder="请输入分配的账号" required>
        </div>
      </div>
      <div class="field">
        <label for="password">密码</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required>
          <button type="button" class="eye" id="togglePassword" aria-label="显示密码" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>
          </button>
        </div>
      </div>

      <div class="agreement">
        <input id="agree" name="agree" type="checkbox" aria-describedby="agreementText">
        <label id="agreementText" for="agree">我已阅读并同意 <a href="user-agreement.html" target="_blank" rel="noopener noreferrer">《用户服务协议》</a>与<a href="privacy-policy.html" target="_blank" rel="noopener noreferrer">《隐私协议》</a></label>
      </div>
      <p class="form-error" id="formError" role="alert" aria-live="polite"></p>

      <button class="submit" id="submit" type="submit">
        <span>登录工作台</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6"/></svg>
      </button>
    </form>
    <p class="help">账号或密码问题，请联系运维管理员</p>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
$('togglePassword').addEventListener('click', () => {
  const input = $('password');
  const shown = input.type === 'text';
  input.type = shown ? 'password' : 'text';
  $('togglePassword').setAttribute('aria-label', shown ? '显示密码' : '隐藏密码');
  $('togglePassword').setAttribute('aria-pressed', String(!shown));
});
$('loginForm').addEventListener('submit', event => {
  event.preventDefault();
  const account = $('account').value.trim();
  const password = $('password').value;
  const error = $('formError');
  error.textContent = '';
  if (!account) { error.textContent = '请输入账号'; $('account').focus(); return; }
  if (!password) { error.textContent = '请输入密码'; $('password').focus(); return; }
  if (!$('agree').checked) { error.textContent = '请先阅读并同意相关协议'; $('agree').focus(); return; }
  const submit = $('submit');
  submit.disabled = true;
  submit.querySelector('span').textContent = '正在进入';
  try { sessionStorage.setItem('tangpa.prototype.session', JSON.stringify({ account, time: Date.now() })); } catch (ignored) {}
  setTimeout(() => {
    const mode = new URLSearchParams(location.search).get('m');
    location.href = 'home.html' + (mode === 'local' ? '?m=local' : '');
  }, 460);
});
</script>
</body>
</html>
