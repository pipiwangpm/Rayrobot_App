<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>机器人详情 · 镋钯</title><link rel="stylesheet" href="assets/device-flow.css"><link rel="stylesheet" href="assets/phone-frame-v18.css"></head><body><script src="assets/device-flow.js"></script><script>
const {device:d,href,icon,esc,shell,toast,confirmAction,$}=Fleet;
const offline=d.state==='offline',fault=d.state==='fault';
const conn=d.connection?`${icon(d.connection,16)}<span>${d.connection==='wifi'?'Wi-Fi':'AP 局域网'}</span><strong>${d.signal>=4?'强':d.signal>=2?'中':'弱'}</strong>`:`${icon('wifi',16)}<span>未连接</span>`;
const hero=`<section class="detail-hero ${esc(d.state)}"><div class="detail-head"><div class="detail-index">机器人编号 <b>${esc(d.id)}</b></div><span class="state-pill ${esc(d.state)}">${esc(d.status)}</span></div><h1>${esc(d.name)}</h1><p class="detail-model">${esc(d.model)}</p><img class="detail-watermark" src="assets/${esc(d.image)}" alt="${esc(d.color)}机器人外观"><div class="detail-specs"><div><span>序列号</span><strong>${esc(d.sn)}</strong></div><div><span>网络地址</span><strong>${esc(d.ip)}</strong></div><div><span>所属分组</span><strong>${esc(d.group)}</strong></div><div><span>当前任务</span><strong>${esc(d.task)}</strong></div><div><span>关联智能体</span><strong>${esc(d.agent)}</strong></div></div><div class="detail-status"><div class="detail-battery"><strong>${d.battery===null?'—':d.battery+'%'}</strong><small>剩余电量</small></div><div class="detail-connection">${conn}</div></div></section>`;
const notice=fault?`<div class="notice">${icon('alert')}<div>机器人存在故障，请查看“关于本机”中的运行信息。</div></div>`:offline?`<div class="notice info">${icon('wifi')}<div>机器人离线，遥操与监控暂不可用。</div></div>`:'';
const command=`<section class="flow-section"><div class="section-head"><h2>控制</h2></div><a class="remote-entry ${offline||fault?'is-disabled':''}" href="${href('remote-control')}" ${offline||fault?'aria-disabled="true" tabindex="-1"':''}><span class="remote-icon">${icon('control',26)}</span><span><strong>遥操</strong><small>方向与移动控制</small></span>${icon('arrow',20)}</a><div class="detail-utility"><a class="utility-tile ${offline||fault?'is-disabled':''}" href="${href('control')}" ${offline||fault?'aria-disabled="true" tabindex="-1"':''}>${icon('power')}<span>模式切换</span></a><a class="utility-tile ${offline?'is-disabled':''}" href="${href('monitor')}" ${offline?'aria-disabled="true" tabindex="-1"':''}>${icon('video')}<span>远程监控</span></a></div></section>`;
const menus=`<section class="flow-section"><div class="section-head"><h2>机器人管理</h2></div><div class="menu-panel"><a class="menu-link" href="${href('device-settings')}"><span class="menu-icon">${icon('settings')}</span><span><strong>机器人设置</strong></span><span class="chevron">›</span></a><a class="menu-link" href="${href('server-connection')}"><span class="menu-icon">${icon('wifi')}</span><span><strong>连接方式</strong></span><span class="chevron">›</span></a><a class="menu-link" href="${href('about-machine')}"><span class="menu-icon">${icon('robot')}</span><span><strong>关于本机</strong></span><span class="chevron">›</span></a><a class="menu-link" href="${href('robot-tools')}"><span class="menu-icon">${icon('more')}</span><span><strong>更多操作</strong></span><span class="chevron">›</span></a></div></section>`;
const stop=`<button class="emergency-link" id="stop" ${offline?'disabled':''}>${icon('alert',16)}紧急停止</button>`;
shell('机器人详情',hero+notice+command+menus+stop,`<a class="icon-button" href="${href('device-settings')}" aria-label="机器人设置">${icon('settings')}</a>`);
$('stop').onclick=()=>confirmAction('确认紧急停止？','此操作当前不可连接真实机器人。',()=>toast('当前未连接真实机器人'));
</script></body></html>
