<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1013"><title>遥操 · 镋钯</title><style>
:root{color-scheme:dark;--orange:#ff6937;--line:#314149;--muted:#91a2aa}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05090b;color:#eaf0f2;font:14px/1.4 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,a{font:inherit;-webkit-tap-highlight-color:transparent}button{cursor:pointer}.console{position:fixed;inset:0;background:#0b1216;display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}.topbar{height:51px;flex:none;display:flex;align-items:center;gap:12px;padding:0 17px;border-bottom:1px solid #2d3b42;background:#121a1f}.icon-button{width:32px;height:32px;display:grid;place-items:center;border:1px solid #3a4c55;border-radius:9px;background:#263139;color:#e7eff1;text-decoration:none}.icon-button svg{width:18px;height:18px}.top-title{font-size:15px;font-weight:700;white-space:nowrap}.top-model{color:#9cadb5;font-size:11px;white-space:nowrap}.spacer{flex:1}.status{color:#f2c16e;font-size:11px;border:1px solid #765b39;background:#3b3125;padding:5px 9px;border-radius:30px;white-space:nowrap}.battery{display:flex;align-items:center;gap:5px;color:#c7d4d8;font:600 12px ui-monospace,monospace}.battery svg{width:16px;height:16px}.fullscreen,.stop{min-height:30px;border-radius:8px;padding:0 10px;border:1px solid #46545c;background:#273239;color:#e7eef1;white-space:nowrap;font-size:11px}.stop{background:#cc4d46;color:#fff;border-color:#e66e62;font-weight:700}.workspace{flex:1;min-height:0;display:grid;grid-template-columns:minmax(118px,22%) minmax(0,1fr) minmax(118px,22%);gap:9px;padding:9px}.side{border:1px solid #2f3d44;border-radius:14px;background:linear-gradient(145deg,#192329,#10191d);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:13px 8px 11px;min-height:0}.side-label{font-size:12px;font-weight:650;color:#d5e0e4}.side small{color:#82949d;font-size:10px}.joystick{position:relative;width:min(100%,145px,22vh);aspect-ratio:1;border:1px solid #4a5d66;border-radius:50%;background:radial-gradient(circle,#27343b 0,#1b262c 42%,#11191d 70%);box-shadow:inset 0 0 0 9px #ffffff06,0 9px 25px #0007;touch-action:none;flex:none}.joystick:before,.joystick:after{content:"";position:absolute;background:#56707a55}.joystick:before{left:50%;top:13%;bottom:13%;width:1px}.joystick:after{top:50%;left:13%;right:13%;height:1px}.thumb{position:absolute;width:44%;height:44%;top:28%;left:28%;border:1px solid #8499a2;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4c6069,#27343b 70%);box-shadow:0 6px 16px #000a;z-index:2;transition:transform .08s}.joystick.active{border-color:#ff8c61;box-shadow:0 0 0 4px #ff693719,inset 0 0 0 9px #ffffff06}.side-foot{display:flex;gap:7px;align-items:center;color:#aabac1;font-size:10px}.side-foot i{width:5px;height:5px;background:#ffb66d;border-radius:50%}.viewport{position:relative;border:1px solid #38505a;border-radius:14px;overflow:hidden;background:radial-gradient(circle at center,#26343a,#0b1216 73%);min-width:0}.viewport:before{content:"";position:absolute;inset:12px;border:1px solid #ffffff13;border-radius:8px;pointer-events:none}.viewport:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0b121683,transparent 30%,transparent 70%,#0b121683);pointer-events:none}.grid{position:absolute;inset:0;opacity:.14;background-image:linear-gradient(#9ab0b81c 1px,transparent 1px),linear-gradient(90deg,#9ab0b81c 1px,transparent 1px);background-size:27px 27px}.robot{position:absolute;left:50%;top:50%;height:min(69%,250px);width:65%;object-fit:contain;transform:translate(-50%,-50%);opacity:.24;filter:grayscale(.8)}.view-head{position:absolute;z-index:2;left:17px;right:17px;top:15px;display:flex;justify-content:space-between;gap:8px;color:#a5b6bf;font-size:10px}.view-head span:last-child{color:#d4dde0}.view-message{position:absolute;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;white-space:nowrap;background:#0b1216bf;border:1px solid #4a5e66;border-radius:9px;padding:8px 12px;color:#d4e0e5;font-size:11px}.view-bottom{position:absolute;z-index:2;left:16px;right:16px;bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:8px;color:#a2b4bc;font-size:10px}.speed{display:flex;align-items:center;gap:6px}.speed button{background:#253139;border:1px solid #40525b;border-radius:6px;color:#c9d5da;padding:4px 7px;font-size:10px}.speed button.active{border-color:#ff8657;background:#3b2c28;color:#ffb68f}.speed-label{display:none}.toast{position:absolute;z-index:10;top:61px;left:50%;transform:translateX(-50%);background:#2b3b42;border:1px solid #5a6e77;padding:8px 14px;border-radius:8px;white-space:nowrap;font-size:11px}[hidden]{display:none!important}@media(orientation:portrait){.console{inset:auto;top:0;left:100dvw;width:100dvh;height:100dvw;transform-origin:top left;transform:rotate(90deg)}}@media(max-height:420px){.topbar{height:43px}.workspace{gap:6px;padding:6px}.side{padding:8px 5px}.side-label{font-size:11px}.joystick{width:min(100%,115px,27vh)}.side-foot,.side small{display:none}.view-bottom{bottom:8px}.view-head{top:8px}}
</style></head><body><script src="assets/device-flow.js"></script><div class="console" id="console"><header class="topbar"><a class="icon-button" id="back" href="device.html" aria-label="返回机器人详情"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m15 5-7 7 7 7"/></svg></a><span class="top-title">遥操</span><span class="top-model" id="robotName"></span><span class="spacer"></span><span class="status">连接待建立</span><span class="battery" id="battery"></span><button class="fullscreen" id="fullscreen">全屏</button><button class="stop" id="stop">急停</button></header><main class="workspace"><section class="side"><span class="side-label">移动</span><div class="joystick" data-stick="移动" aria-label="移动摇杆"><span class="thumb"></span></div><span class="side-foot"><i></i>前进 / 后退 / 平移</span></section><section class="viewport" aria-label="机器人视野"><div class="grid"></div><img class="robot" id="robotImage" alt=""><div class="view-head"><span>机器人视野</span><span id="network"></span></div><div class="view-message">视频流未连接</div><div class="view-bottom"><span>控制权未建立</span><div class="speed"><span class="speed-label">速度</span><button data-speed="低" class="active">低速</button><button data-speed="中">中速</button><button data-speed="高">高速</button></div></div></section><section class="side"><span class="side-label">转向</span><div class="joystick" data-stick="转向" aria-label="转向摇杆"><span class="thumb"></span></div><span class="side-foot"><i></i>左转 / 右转</span></section></main><div class="toast" id="toast" hidden></div></div><script>
const d=Fleet.device;document.getElementById('robotName').textContent=d.name;document.getElementById('battery').innerHTML=Fleet.icon('battery',16)+(d.battery===null?'—':d.battery+'%');document.getElementById('network').textContent=d.connection==='wifi'?'Wi-Fi':d.connection==='ap'?'AP 局域网':'未连接';document.getElementById('robotImage').src='assets/'+d.image;document.getElementById('back').href=Fleet.href('device');
let timer;function toast(message){const el=document.getElementById('toast');el.textContent=message;el.hidden=false;clearTimeout(timer);timer=setTimeout(()=>el.hidden=true,1900)}
document.getElementById('fullscreen').onclick=async()=>{try{await document.getElementById('console').requestFullscreen();try{await screen.orientation.lock('landscape')}catch(e){}}catch(e){toast('当前浏览器无法进入全屏')}};
document.getElementById('back').onclick=async()=>{try{screen.orientation.unlock()}catch(e){}try{if(document.fullscreenElement)await document.exitFullscreen()}catch(e){}};
document.getElementById('stop').onclick=()=>toast('控制连接未建立');
document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-speed]').forEach(x=>x.classList.toggle('active',x===b));toast('控制连接未建立')});
document.querySelectorAll('[data-stick]').forEach(stick=>{const thumb=stick.querySelector('.thumb');let pointer=null;function move(e){if(e.pointerId!==pointer)return;const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,rotated=matchMedia('(orientation:portrait)').matches;let x=rotated?e.clientY-cy:e.clientX-cx,y=rotated?-(e.clientX-cx):e.clientY-cy;const max=26,dist=Math.hypot(x,y);if(dist>max){x=x/dist*max;y=y/dist*max}thumb.style.transform=`translate(${x}px,${y}px)`}stick.onpointerdown=e=>{pointer=e.pointerId;stick.setPointerCapture(pointer);stick.classList.add('active');move(e)};stick.onpointermove=move;const end=e=>{if(e.pointerId!==pointer)return;pointer=null;stick.classList.remove('active');thumb.style.transform='';toast('控制连接未建立')};stick.onpointerup=end;stick.onpointercancel=end});
</script></body></html>
