<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>机器人详情 · 镋钯</title><link rel="stylesheet" href="assets/device-flow.css"></head><body><script src="assets/device-flow.js"></script><script>
const {device:d,href,icon,esc,shell,toast,confirmAction,$}=Fleet;
const offline=d.state==='offline',fault=d.state==='fault';
const action=(label,ico,url,disabled=false)=>`<a class="action-card ${disabled?'is-disabled':''}" href="${url}" ${disabled?'aria-disabled="true" tabindex="-1"':''}>${icon(ico)}<span>${label}</span></a>`;
function signalRow(mode,label,ico){const active=d.connection===mode;return `<div class="hero-signal-row ${active?'active':''}">${icon(ico,14)}<span>${label}</span>${active?`<span class="hero-bars level-${d.signal}" aria-label="信号${d.signal>=4?'强':d.signal>=2?'中':'弱'}">${[1,2,3,4].map(i=>`<i class="${i<=d.signal?'on':''}"></i>`).join('')}</span><small class="signal-quality">${d.signal>=4?'强':d.signal>=2?'中':'弱'}</small>`:`<small>${offline?'离线':'未连接'}</small>`}</div>`}
const hero=`<div class="device-hero"><div class="hero-copy"><div class="hero-id">机器人编号 ${esc(d.id)}</div><h1>${esc(d.name)}</h1><p>${esc(d.model)}</p><span class="state-pill ${esc(d.state)}">${esc(d.status)}</span></div><img class="robot-image" src="assets/${esc(d.image)}" alt="${esc(d.color)}机器人外观效果图"><div class="hero-bottom"><div class="hero-metric"><strong>${d.battery===null?'—':d.battery+'<small>%</small>'}</strong><span class="track"><i style="width:${d.battery??0}%"></i></span><span>剩余电量</span></div><div class="hero-signals" aria-label="连接信号">${signalRow('wifi','Wi-Fi','wifi')}${signalRow('ap','AP','ap')}</div></div></div>`;
const notice=fault?`<div class="notice">${icon('alert')}<div>机器人在线，但存在故障。请查看“关于本机”中的运行信息并核实实机状态。</div></div>`:offline?`<div class="notice info">${icon('wifi')}<div>机器人当前离线，遥操与监控暂不可用。</div></div>`:'';
const quick=`<section class="flow-section"><div class="section-head"><h2>常用功能</h2></div><div class="quick-actions compact-actions">${action('遥操与模式','control',href('control'),offline||fault)}${action('远程监控','video',href('monitor'),offline)}${action('机器人设置','settings',href('device-settings'))}${action('连接方式','wifi',href('server-connection'))}</div></section>`;
const menus=`<section class="flow-section"><div class="section-head"><h2>更多</h2></div><div class="menu-panel"><a class="menu-link" href="${href('about-machine')}"><span class="menu-icon">${icon('robot')}</span><span><strong>关于本机</strong><small>运行信息、机器人档案、版本信息</small></span><span class="chevron">›</span></a><a class="menu-link" href="${href('robot-tools')}"><span class="menu-icon">${icon('more')}</span><span><strong>其他操作</strong><small>投放、口播、任务与维护</small></span><span class="chevron">›</span></a></div></section>`;
const stop=`<button class="emergency-link" id="stop" ${offline?'disabled':''}>${icon('alert',16)}紧急停止</button>`;
shell('机器人详情',hero+notice+quick+menus+stop+`<p class="flow-footer">页面为交互原型，不连接真实机器人。</p>`,`<a class="icon-button" href="${href('device-settings')}" aria-label="机器人设置">${icon('settings')}</a>`);
$('stop').onclick=()=>confirmAction('确认紧急停止？','原型只展示确认流程，不会向机器人下发指令。',()=>toast('已完成急停流程演示'));
</script></body></html>
