<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>单机任务 · 镋钯</title><link rel="stylesheet" href="assets/device-flow.css"></head><body><script src="assets/device-flow.js"></script><script>
const {device:d,href,icon,esc,shell,section,toast,confirmAction,$}=Fleet;
const type=new URLSearchParams(location.search).get('type')==='voice'?'voice':'ad';
const title=type==='voice'?'口播任务':'单机广告投放';
const unavailable=d.id!=='A03'||d.state==='offline';
const ad=`${section('投放内容',`<label class="form-field"><span>广告素材</span><select class="form-input" id="material"><option value="">选择演示素材</option><option>展厅欢迎屏</option><option>新品介绍短片</option><option>品牌形象片</option></select></label>`)}${section('播放方式',`<label class="form-field"><span>播放次数</span><select class="form-input" id="repeat"><option value="1">单次</option><option value="3">循环 3 次</option><option value="0">持续循环</option></select></label><label class="form-field"><span>执行时间</span><select class="form-input" id="when"><option>立即执行</option><option>加入任务排期</option></select></label>`)}`;
const voice=`${section('播报内容',`<label class="form-field"><span>口播文字</span><textarea class="form-input" id="voiceText" rows="5" maxlength="200" placeholder="输入希望机器人播报的文字" style="padding:12px;min-height:130px;resize:vertical"></textarea><p class="subtle" id="counter">0 / 200 字</p></label>`)}${section('播报设置',`<label class="form-field"><span>音色</span><select class="form-input" id="voice"><option>晓雅</option><option>标准女声</option><option>标准男声</option></select></label><label class="form-field"><span>播放次数</span><select class="form-input" id="times"><option>单次</option><option>循环 3 次</option><option>循环 5 次</option></select></label>`)}`;
const blocked=unavailable?`<div class="notice">${icon('alert')}<div>此机器人的单机${title}能力未在原型资料中确认，或机器人当前离线。请从任务中心查看可用能力。</div></div>`:`<div class="notice info">${icon('robot')}<div>仅演示单机任务的填写与确认流程，不会向机器人下发内容。</div></div>`;
const body=`<div class="page-intro"><h1>${title}</h1><p>目标机器人：${esc(d.name)}</p></div>${blocked}${unavailable?'':type==='voice'?voice:ad}${unavailable?`<a class="button secondary block" href="${href('device')}">返回机器人详情</a>`:`<button class="button primary block" id="submit">预览并确认</button>`}<p class="flow-footer">多机器人投放和排期请在任务中心编排。</p>`;
shell(title,body,`<a class="icon-button" href="${href('device')}" aria-label="机器人详情">${icon('robot')}</a>`,href('device'));
if(!unavailable){if(type==='voice'){$('voiceText').oninput=()=>$('counter').textContent=$('voiceText').value.length+' / 200 字'}$('submit').onclick=()=>{let summary;if(type==='voice'){const value=$('voiceText').value.trim();if(!value){toast('请输入口播文字');return}summary=`${d.name} · ${$('voice').value} · ${$('times').value} · ${value.length} 字`}else{const value=$('material').value;if(!value){toast('请选择广告素材');return}summary=`${d.name} · ${value} · ${$('repeat').selectedOptions[0].textContent} · ${$('when').value}`}confirmAction('确认'+title+'？',summary+'。原型不会提交任务或控制实机。',()=>toast('已完成任务提交流程演示'))}};
</script></body></html>
