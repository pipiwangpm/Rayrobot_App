const rows=agents.filter(a=>matches(a,filter)&&[a.name,a.role,a.desc,a.model||''].join(' ').toLowerCase().includes(query.toLowerCase()));
$('count').textContent=`我的智能体 · ${rows.length} 个`;
$('agents').innerHTML=rows.length?rows.map(a=>`<article class="agent-card ${a.ready?'':'pending'}"><div class="agent-heading"><div class="avatar" aria-hidden="true">${a.glyph}</div><div class="identity"><h2>${a.name}</h2><p>${a.role}</p></div><div class="config-status"><i></i>${a.ready?'配置完整':'待配置'}</div></div><p class="persona">${a.desc}</p><div class="resources"><div><small>知识库</small><strong>${a.docs.length?a.docs.length+' 份文档':'未添加'}</strong></div><div><small>对话模型</small><strong>${a.model||'未选择'}</strong></div><div><small>声音</small><strong>${a.voice||'未选择'}</strong></div></div>${a.ready?'':`<div class="draft-note">${icon('warn')}补充知识库与模型，选择声音后即可绑定机器人。</div>`}<div class="agent-footer"><div class="binding">${a.bound?`<strong>使用中</strong> · <em>${a.bound}</em> 台机器人`:'尚未绑定机器人'}</div><div class="footer-actions">${a.ready?`<button class="quiet-action" data-detail="${a.id}">详情</button>`:''}<a class="edit-link" href="agent-builder.html?agent=${a.id}">${a.ready?'编辑':'继续配置'}${icon('arrow')}</a></div></div>${a.ready&&!a.bound?`<button class="primary" style="width:100%;margin-top:12px" data-bind="${a.id}">绑定到机器人 ${icon('arrow')}</button>`:''}</article>`).join(''):'<div class="empty">没有找到对应智能体<button id="reset">清空筛选条件</button></div>';
$('tabs').querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});$('agents').querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>details(b.dataset.detail));$('agents').querySelectorAll('[data-bind]').forEach(b=>b.onclick=()=>binding(b.dataset.bind));if($('reset'))$('reset').onclick=()=>{query='';filter='all';$('search').value='';render()};
}
function openSheet(title,html){lastFocus=document.activeElement;$('sheetTitle').textContent=title;$('sheetBody').innerHTML=html;$('backdrop').hidden=false;document.body.style.overflow='hidden';$('closeSheet').focus()}
function closeSheet(){$('backdrop').hidden=true;document.body.style.overflow='';lastFocus?.focus()}
$('closeSheet').onclick=closeSheet;$('backdrop').onclick=e=>{if(e.target===$('backdrop'))closeSheet()};
document.addEventListener('keydown',e=>{if($('backdrop').hidden)return;if(e.key==='Escape')closeSheet();if(e.key==='Tab'){const nodes=[...$('backdrop').querySelectorAll('button,a[href],input')];if(e.shiftKey&&document.activeElement===nodes[0]){e.preventDefault();nodes.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===nodes.at(-1)){e.preventDefault();nodes[0].focus()}}});
function details(id){const a=agents.find(a=>a.id===id);openSheet(a.name+' · 配置详情',`<p class="intro-sheet">${a.desc}</p><div class="detail-row"><span>应用场景</span><strong>${a.role}</strong></div><div class="detail-row"><span>对话模型</span><strong>${a.model}</strong></div><div class="detail-row"><span>声音</span><strong>${a.voice}</strong></div><div class="detail-row"><span>绑定机器人</span><strong>${a.bound} 台</strong></div><div class="detail-row"><span>开场白</span><strong>${a.opening||'未设置'}</strong></div><label>知识库文档</label><ul>${a.docs.map(d=>`<li>${esc(d)}</li>`).join('')}</ul><a class="primary" href="agent-builder.html?agent=${id}">编辑智能体</a>`)}
function binding(id){const a=agents.find(a=>a.id===id);openSheet('绑定'+a.name,`<p class="intro-sheet">先选择要使用「${a.name}」的机器人，再进入机器人控制，在“自主交互”中更换智能体。</p><a class="primary" href="home.html">前往选择机器人 ${icon('arrow')}</a>`)}
$('resourceOverview').onclick=()=>openSheet('资源概览',`<p>当前原型中的智能体资源</p><div class="detail-row"><span>知识库文档</span><strong>4 份</strong></div><div class="detail-row"><span>已配模型</span><strong>3 种</strong></div><div class="detail-row"><span>声纹克隆</span><strong>3 个</strong></div><p>在智能体编辑页中配置知识库、模型与声音。</p>`);
$('help').onclick=()=>openSheet('智能体是什么',`<p class="intro-sheet">智能体决定机器人如何说话、知道什么，以及使用哪一种声音。</p><div class="detail-row"><span>人设</span><strong>角色与交流方式</strong></div><div class="detail-row"><span>知识库</span><strong>回答问题时参考的资料</strong></div><div class="detail-row"><span>模型</span><strong>理解问题并组织回答</strong></div><div class="detail-row"><span>声音</span><strong>机器人说话的音色</strong></div><p>配置完成后，在机器人的自主交互模式中选择智能体。</p>`);
$('search').oninput=e=>{query=e.target.value;render()};$('clearSearch').onclick=()=>{query='';$('search').value='';render();$('search').focus()};document.querySelectorAll('[data-stat]').forEach(b=>b.onclick=()=>{filter=b.dataset.stat;render()});render();
</script></body></html>
